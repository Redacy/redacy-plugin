<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="redacy-gettone" content="{{GETTONE}}">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pannello · redacy</title>
<style id="contenuti-css">
/* Contenuti dei cinque pannelli. Usa solo variabili --pc-* (con riserve sensate). Classi tutte con prefisso pc-. */
.pc {
  --_t: var(--pc-testo, #1c1c20); --_t2: var(--pc-testo-2, #44444d); --_t3: var(--pc-testo-3, #5c5c66);
  --_s: var(--pc-superficie, rgba(255,255,255,.62)); --_s2: var(--pc-superficie-2, rgba(255,255,255,.42));
  --_l: var(--pc-linea, rgba(20,20,40,.16));
  --_acc: var(--pc-accento, #2455c2); --_su: var(--pc-su-accento, #fff);
  --_att: var(--pc-attesa, #b36200); --_corre: var(--pc-corre, #2560d8); --_ok: var(--pc-ok, #1a7a4c); --_err: var(--pc-errore, #c4342a);
  --_r: var(--pc-raggio, 14px);
  --_f: var(--pc-font, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
  --_ft: var(--pc-font-titoli, var(--_f)); --_fm: var(--pc-font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
  container-type: size; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; position: relative;
  display: flex; flex-direction: column; font: 15px/1.5 var(--_f); color: var(--_t); -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pc {
    --_t: var(--pc-testo, #f2f2f6); --_t2: var(--pc-testo-2, #cacad4); --_t3: var(--pc-testo-3, #a6a6b3);
    --_s: var(--pc-superficie, rgba(255,255,255,.07)); --_s2: var(--pc-superficie-2, rgba(255,255,255,.045)); --_l: var(--pc-linea, rgba(255,255,255,.17));
    --_acc: var(--pc-accento, #86a9ff); --_su: var(--pc-su-accento, #0b1020);
    --_att: var(--pc-attesa, #ffb547); --_corre: var(--pc-corre, #6ea2ff); --_ok: var(--pc-ok, #4fd49b); --_err: var(--pc-errore, #ff7b70);
  }
}
:root[data-theme="dark"] .pc {
  --_t: var(--pc-testo, #f2f2f6); --_t2: var(--pc-testo-2, #cacad4); --_t3: var(--pc-testo-3, #a6a6b3);
  --_s: var(--pc-superficie, rgba(255,255,255,.07)); --_s2: var(--pc-superficie-2, rgba(255,255,255,.045)); --_l: var(--pc-linea, rgba(255,255,255,.17));
  --_acc: var(--pc-accento, #86a9ff); --_su: var(--pc-su-accento, #0b1020);
  --_att: var(--pc-attesa, #ffb547); --_corre: var(--pc-corre, #6ea2ff); --_ok: var(--pc-ok, #4fd49b); --_err: var(--pc-errore, #ff7b70);
}
.pc *, .pc *::before, .pc *::after { box-sizing: border-box; }
.pc button { font: inherit; color: inherit; }
.pc code { font-family: var(--_fm); }
.pc-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.pc-i { flex: none; display: block; }
.pc button:focus-visible, .pc summary:focus-visible, .pc input:focus-visible, .pc .pc-wf:focus-visible, .pc a:focus-visible { outline: 2px solid var(--_acc); outline-offset: 2px; }

/* stati: --_tc e' il colore dello stato (icona e bordo, mai il testo) */
.pc-s-ok, .pc-t-ok { --_tc: var(--_ok); } .pc-s-corre, .pc-t-corre { --_tc: var(--_corre); }
.pc-s-attesa, .pc-t-attesa { --_tc: var(--_att); } .pc-s-err, .pc-t-err { --_tc: var(--_err); }
.pc-s-ferma, .pc-t-ferma { --_tc: var(--_t2); } .pc-s-calmo, .pc-t-calmo { --_tc: var(--_t3); }
.pc-tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border-radius: 999px; font-size: 12.5px; font-weight: 650; line-height: 1.35; color: var(--_t);
  border: 1px solid color-mix(in srgb, var(--_tc, var(--_l)) 70%, transparent); background: color-mix(in srgb, var(--_tc, var(--_t3)) 14%, transparent); white-space: nowrap; }
.pc-tag .pc-i { color: var(--_tc); }

/* barra dei livelli interni */
.pc-barra-w { flex: none; }
.pc-barra { flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--_l); min-height: 48px; }
.pc-indietro { flex: none; border: 1px solid var(--_l); background: var(--_s2); border-radius: 10px; padding: 6px 12px; min-height: 34px; font-weight: 650; font-size: 14px; cursor: pointer; }
.pc-indietro:hover { border-color: var(--_acc); }
.pc-brici { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: nowrap; gap: 0; min-width: 0; font-size: 13.5px; color: var(--_t2); overflow: hidden; }
.pc-brici li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pc-brici li + li::before { content: "›"; margin: 0 8px; color: var(--_t3); }
.pc-brici li:last-child { color: var(--_t); font-weight: 650; flex-shrink: 0; }

.pc-corpo { flex: 1; min-height: 0; display: flex; flex-direction: column; min-width: 0; }
.pc-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 20px 22px 32px; position: relative; overscroll-behavior: contain; }
@container (max-width: 520px) { .pc-scroll { padding: 16px 14px 28px; } }

@keyframes pc-za { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
@keyframes pc-zi { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
@keyframes pc-df { from { opacity: 0; } to { opacity: 1; } }
@keyframes pc-pulsa { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--_corre) 50%, transparent); } 60% { box-shadow: 0 0 0 8px transparent; } }
@keyframes pc-pulsa-s { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
.pc-anima-a { animation: pc-za .26s cubic-bezier(.2,.7,.2,1) both; }
.pc-anima-i { animation: pc-zi .26s cubic-bezier(.2,.7,.2,1) both; }
@media (prefers-reduced-motion: reduce) {
  .pc-anima-a, .pc-anima-i { animation: pc-df .18s linear both; }
  .pc-pulsa, .pc-perc-p.pc-s-corre, .pc-pulsa-s { animation: none !important; }
}

/* testo */
.pc-tit { font: 700 25px/1.2 var(--_ft); letter-spacing: -.01em; margin: 0; }
.pc-sez { display: flex; align-items: center; gap: 8px; margin: 28px 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--_t2); }
.pc-sez-n { font-size: 12.5px; letter-spacing: 0; padding: 1px 8px; border-radius: 999px; background: var(--_s2); border: 1px solid var(--_l); color: var(--_t); }
.pc-sezione:first-child .pc-sez { margin-top: 6px; }
.pc-et { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--_t2); }
.pc-p { margin: 0 0 12px; font-size: 15.5px; line-height: 1.6; }
.pc-meta { margin: 2px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--_t2); }
.pc-tenue { color: var(--_t2); }
.pc-vuoto { margin: 0; padding: 12px 14px; border: 1px dashed var(--_l); border-radius: 12px; color: var(--_t2); font-size: 14.5px; }
.pc-intro { margin-bottom: 18px; } .pc-intro .pc-p { margin-top: 6px; }
.pc-cod { font-size: .88em; padding: 1px 6px; border-radius: 6px; background: var(--_s2); border: 1px solid var(--_l); overflow-wrap: anywhere; }
.pc-a { color: var(--_acc); text-underline-offset: 2px; }
.pc-suggerimento { margin: 8px 2px 0; font-size: 13.5px; color: var(--_t2); }

/* pulsanti e chip */
.pc-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; min-height: 36px; border-radius: 10px; border: 1px solid var(--_l); background: var(--_s2); font-weight: 650; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.pc-btn:hover { border-color: var(--_acc); }
.pc-btn-pericolo { border: 2px solid var(--_err); background: color-mix(in srgb, var(--_err) 16%, transparent); }
.pc-btn-ferma .pc-i { color: var(--_err); }
.pc-chip { display: inline-flex; align-items: center; gap: 5px; margin: 2px 2px 2px 0; padding: 3px 11px; min-height: 28px; border-radius: 999px; border: 1px solid var(--_l); background: var(--_s2); font-size: 13.5px; font-weight: 600; line-height: 1.3; cursor: pointer; text-align: left; }
.pc-chip:hover { border-color: var(--_acc); }
.pc-chip-manca { border-style: dashed; color: var(--_t2); }
.pc-chip-file code { font-size: 12.5px; }
span.pc-chip { cursor: default; }
.pc-chips { margin: 0 0 8px; line-height: 2; }

/* voci / carte */
.pc-cols { display: grid; grid-template-columns: minmax(0,1fr); gap: 0 32px; }
@container (min-width: 880px) { .pc-cols { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
@container (min-width: 600px) { .pc-cols-2 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
.pc-voci { display: flex; flex-direction: column; gap: 10px; }
.pc-voce { position: relative; display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: start; gap: 4px 12px; padding: 13px 14px; border-radius: var(--_r); background: var(--_s); border: 1px solid var(--_l); }
.pc-voce-attesa { border-left: 4px solid var(--_att); } .pc-voce-rit { border-left: 6px solid var(--_att); } .pc-voce-err { border-left: 4px solid var(--_err); }
.pc-voce-ic { margin-top: 1px; color: var(--_att); } .pc-voce-err .pc-voce-ic { color: var(--_err); }
.pc-voce-h { margin: 0; font-size: 15.5px; font-weight: 650; line-height: 1.35; }
.pc-voce-tag { margin: 8px 0 0; display: flex; gap: 6px; flex-wrap: wrap; }
.pc-voce > .pc-btn, .pc-voce-az { align-self: center; }
.pc-voce-az { display: flex; gap: 8px; flex-wrap: wrap; }

.pc-oggi-testa { margin-bottom: 8px; }
.pc-data { margin: 0; font: 650 14px var(--_f); color: var(--_t2); letter-spacing: .02em; }
.pc-frase { margin: 4px 0 6px; font: 700 clamp(22px, 4.6cqw, 32px)/1.2 var(--_ft); letter-spacing: -.015em; max-width: 30ch; text-wrap: balance; }
@container (min-width: 880px) { .pc-frase { max-width: 40ch; } }

.pc-lav { padding: 14px 16px; border-radius: var(--_r); background: var(--_s); border: 1px solid var(--_l); border-left: 4px solid var(--_corre); }
.pc-lav-testa { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pc-lav-passo { margin: 0 0 4px; font-size: 15px; }
.pc-lav-az { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.pc-conf { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--_err); background: color-mix(in srgb, var(--_err) 9%, transparent); }
.pc-conf-t { margin: 0 0 10px; font-weight: 600; font-size: 15px; }
.pc-conf-b { display: flex; gap: 8px; flex-wrap: wrap; }
.pc-perc { list-style: none; display: flex; align-items: center; margin: 12px 0 8px; padding: 0; }
.pc-perc-p { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--_tc); color: var(--_tc); background: color-mix(in srgb, var(--_tc) 16%, var(--_s2)); }
.pc-perc-p.pc-s-corre { animation: pc-pulsa 2.4s ease-out infinite; }
.pc-perc-p.pc-s-calmo { border-style: dashed; }
.pc-perc-lin { flex: 1 1 0; min-width: 12px; max-width: 64px; height: 2px; background: var(--_l); } .pc-l-ok { background: var(--_ok); }
.pc-recenti { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.pc-rec { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--_l); }
.pc-rec-ic { margin-top: 2px; color: var(--_tc); }
.pc-rec-h { margin: 0; font-weight: 650; font-size: 15px; } .pc-rec-c { margin: 3px 0 0; font-size: 14px; color: var(--_t); overflow-wrap: anywhere; }

/* processi */
.pc-proc-lista { display: grid; gap: 14px; grid-template-columns: minmax(0,1fr); }
@container (min-width: 900px) { .pc-proc-lista { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); } }
.pc-proc { display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; padding: 16px 18px; border-radius: var(--_r); background: var(--_s); border: 1px solid var(--_l); cursor: pointer; }
.pc-proc:hover { border-color: var(--_acc); }
.pc-proc-testa { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pc-proc-nome { font: 700 19px/1.25 var(--_ft); }
.pc-proc-obj { font-size: 15px; line-height: 1.5; }
.pc-proc-vai { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 650; color: var(--_acc); margin-top: 2px; }
.pc-dl { margin: 0; display: grid; gap: 8px; }
.pc-dl > div { display: grid; grid-template-columns: minmax(0,1fr); gap: 1px; }
.pc-dl dt { font-size: 13px; font-weight: 700; color: var(--_t2); letter-spacing: .02em; }
.pc-dl dd { margin: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
@container (min-width: 560px) { .pc-dl > div { grid-template-columns: 150px minmax(0,1fr); gap: 12px; } .pc-dl dt { padding-top: 2px; } }
.pc-dl-grande { margin: 12px 0 4px; padding: 14px 16px; background: var(--_s); border: 1px solid var(--_l); border-radius: var(--_r); }
.pc-obj-g { margin: 6px 0 12px; font-size: 17px; line-height: 1.5; font-weight: 500; }
.pc-passo-testa { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pc-passo-ic { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: var(--_s); border: 1px solid var(--_l); }
.pc-passo-testa:has(.pc-passo-ic) { justify-content: flex-start; align-items: center; } .pc-passo-testa:has(.pc-passo-ic) .pc-tag { margin-left: auto; }

.pc-wf { overflow: auto; border: 1px solid var(--_l); border-radius: var(--_r); background: var(--_s2); max-width: 100%; }
.pc-wf-in { position: relative; margin: 0 auto; }
.pc-wf-svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.pc-arco { fill: none; stroke: var(--_t3); stroke-width: 2.2; stroke-linecap: round; } .pc-arco-ok { stroke: var(--_ok); }
.pc-frecc { fill: var(--_t3); }
.pc-nodo { position: absolute; display: grid; grid-template-columns: auto minmax(0,1fr); grid-template-rows: auto 1fr auto; column-gap: 8px; row-gap: 1px; align-items: center; padding: 8px 11px; text-align: left; border-radius: 14px; background: var(--_s); border: 1.5px solid var(--_tc, var(--_l)); color: var(--_t); cursor: pointer; overflow: hidden; }
.pc-nodo:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--_acc) 55%, transparent); }
.pc-nodo-ic { grid-row: 1; grid-column: 1; display: grid; color: var(--_t2); }
.pc-nodo-et { grid-row: 1; grid-column: 2; font-size: 12px; font-weight: 600; color: var(--_t2); }
.pc-nodo-nome { grid-column: 1 / -1; grid-row: 2; align-self: center; font-size: 13.5px; font-weight: 650; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pc-nodo-st { grid-column: 1 / -1; grid-row: 3; display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; }
.pc-nodo-st .pc-i { color: var(--_tc); }
.pc-nodo-innesco { cursor: default; border-style: dashed; background: color-mix(in srgb, var(--_acc) 8%, var(--_s)); border-color: var(--_t3); }
.pc-nodo-innesco:hover { box-shadow: none; }
.pc-nodo-innesco .pc-nodo-nome { font-size: 12.5px; -webkit-line-clamp: 3; font-weight: 600; }
.pc-nodo.pc-s-corre, .pc-nodo.pc-s-attesa, .pc-nodo.pc-s-err { border-width: 2.5px; }
.pc-nodo.pc-s-attesa { background: color-mix(in srgb, var(--_att) 11%, var(--_s)); }
.pc-nodo.pc-s-err { background: color-mix(in srgb, var(--_err) 9%, var(--_s)); }
.pc-nodo.pc-s-ferma { border-style: dotted; border-width: 2.5px; }
.pc-nodo.pc-s-calmo { border-style: dashed; } .pc-nodo.pc-s-calmo .pc-nodo-nome { color: var(--_t2); }
.pc-pulsa { animation: pc-pulsa 2.4s ease-out infinite; }
.pc-leg { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 10px 2px 0; padding: 0; font-size: 12.5px; }
.pc-leg li { display: inline-flex; align-items: center; gap: 6px; color: var(--_t); } .pc-leg .pc-i { color: var(--_tc); }
.pc-corse { display: flex; flex-direction: column; gap: 8px; }
.pc-corsa { border: 1px solid var(--_l); border-radius: 12px; background: var(--_s); }
.pc-corsa summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; padding: 10px 14px; }
.pc-corsa summary::-webkit-details-marker { display: none; }
.pc-corsa-s { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; } .pc-corsa-q { font-weight: 600; font-size: 14.5px; }
.pc-corsa-e { font-size: 13.5px; color: var(--_t2); min-width: 0; overflow-wrap: anywhere; }
.pc-cps { list-style: none; margin: 0; padding: 4px 14px 12px; display: grid; gap: 8px; border-top: 1px solid var(--_l); }
.pc-cps .pc-cp:first-child { margin-top: 8px; }
.pc-cp { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; } .pc-cp-ic { color: var(--_tc); margin-top: 2px; }
.pc-cp-h { margin: 0; font-size: 14.5px; font-weight: 600; } .pc-cp-e { margin: 1px 0 0; font-size: 14px; overflow-wrap: anywhere; } .pc-cp-nota { color: var(--_t); font-style: italic; }
.pc-ultima { padding: 12px 14px; border-radius: var(--_r); background: var(--_s); border: 1px solid var(--_l); }

/* file: schede + grezzo */
.pc-file { margin-top: 8px; }
.pc-file-nome { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--_t2); font-size: 13.5px; } .pc-file-nome code { overflow-wrap: anywhere; }
.pc-kv { margin: 0; display: grid; gap: 0; }
.pc-kv-r { display: grid; grid-template-columns: minmax(0,1fr); gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--_l); }
@container (min-width: 520px) { .pc-kv-r { grid-template-columns: minmax(110px, 26%) minmax(0,1fr); gap: 14px; } }
.pc-kv dt { font: 600 13px var(--_fm); color: var(--_t2); overflow-wrap: anywhere; padding-top: 2px; }
.pc-kv dd { margin: 0; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
.pc-kv-in { padding-left: 12px; border-left: 2px solid var(--_l); margin: 2px 0; } .pc-kv-in .pc-kv-r:last-child { border-bottom: 0; }
.pc-valori { display: flex; flex-wrap: wrap; gap: 4px 0; } .pc-val { display: inline-block; padding: 2px 10px; margin-right: 6px; border-radius: 999px; background: var(--_s2); border: 1px solid var(--_l); font-size: 14px; }
.pc-schede { display: grid; gap: 8px; }
.pc-scheda { position: relative; padding: 10px 12px 10px 38px; border-radius: 12px; background: var(--_s); border: 1px solid var(--_l); }
.pc-scheda-n { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--_s2); border: 1px solid var(--_l); }
.pc-scheda .pc-kv-r:first-child { padding-top: 0; } .pc-scheda .pc-kv-r:last-child { border-bottom: 0; padding-bottom: 0; }
.pc-nullo { color: var(--_t3); font-style: italic; } .pc-bool, .pc-num { font-weight: 650; }
.pc-testoV-multi { white-space: pre-line; display: block; }
.pc-grezzo { margin-top: 14px; border: 1px solid var(--_l); border-radius: 12px; background: var(--_s2); }
.pc-grezzo summary { display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; font-weight: 650; font-size: 13.5px; list-style: none; } .pc-grezzo summary::-webkit-details-marker { display: none; }
.pc-pre { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--_s2); border: 1px solid var(--_l); font: 13px/1.6 var(--_fm); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--_t); }
.pc-grezzo .pc-pre { border: 0; border-top: 1px solid var(--_l); border-radius: 0 0 12px 12px; background: transparent; }

<script id="fonte">
/* redacy · skills/pannello/sorgenti/fonte.js
   Da dove arrivano i dati del pannello nel plugin: dal server locale (pannello.py), nella stessa forma
   dei dati finti del prototipo, window.DATI = {stato, file}.
   - all'avvio: /api/stato, /api/file (il testo dei file) e /api/su-misura (le scelte dell'utente);
   - ogni 4 secondi: /api/stato e /api/file-firma; il testo dei file si rilegge solo se la firma cambia;
   - «Ferma»: POST /api/ferma col gettone che il server mette nella pagina.
   La pagina parte quando window.DATI_PRONTI si risolve. Se il server non risponde, un avviso lo dice e
   si riprova da soli. */
(function () {
  'use strict';
  window.REDACY_PANNELLO = true;
  var meta = document.querySelector('meta[name="redacy-gettone"]');
  var GETTONE = meta ? meta.getAttribute('content') : '';
  var OGNI = 4000;
  var file = {}, firmaFile = null, inCorso = false, falliti = 0;

  function prendi(u) {
    return fetch(u, { cache: 'no-store', headers: { Accept: 'application/json' } }).then(function (r) {
      if (!r.ok) throw new Error(u + ' ' + r.status);
      return r.json();
    });
  }

  function giro() {
    return Promise.all([prendi('/api/stato'), prendi('/api/file-firma')]).then(function (x) {
      var stato = x[0], ff = x[1] && x[1].firma;
      if (ff && ff === firmaFile) return { stato: stato, file: file, firma_file: firmaFile };
      return prendi('/api/file').then(function (y) {
        file = (y && y.file) || {}; firmaFile = y && y.firma;
        return { stato: stato, file: file, firma_file: firmaFile };
      });
    });
  }

  /* l'avviso: una riga in alto, sopra a tutto */
  var avviso = null, via = null;
  function mostraAvviso(testo, breve) {
    if (!document.body) return;
    if (!avviso) {
      avviso = document.createElement('p');
      avviso.setAttribute('role', 'status');
      avviso.style.cssText = 'position:fixed;z-index:2147483000;left:50%;transform:translateX(-50%);' +
        'top:calc(env(safe-area-inset-top, 0px) + 12px);margin:0;max-width:min(560px, calc(100vw - 32px));' +
        'padding:10px 16px;border-radius:12px;background:#2a1f12;color:#fff4e0;font:500 14px/1.4 -apple-system,' +
        'BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.25);text-align:center';
      document.body.appendChild(avviso);
    }
    avviso.textContent = testo;
    avviso.hidden = false;
    clearTimeout(via);
    if (breve) via = setTimeout(nascondiAvviso, 6000);
  }
  function nascondiAvviso() { if (avviso) avviso.hidden = true; }

  function aggiorna() {
    if (inCorso) return;
    inCorso = true;
    giro().then(function (d) {
      falliti = 0; if (avviso && !via) nascondiAvviso();
      window.DATI = d;
      if (window.Contenuti && window.Contenuti.carica) window.Contenuti.carica(d);
    }, function () {
      falliti++;
      if (falliti >= 2) mostraAvviso('Non riesco a leggere lo studio. Riprovo da solo; se dura, riaccendi il pannello.');
    }).then(function () { inCorso = false; });
  }

  function ferma(id) {
    return fetch('/api/ferma', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Gettone': GETTONE },
      body: JSON.stringify({ id: id })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok || (j && j.ok === false)) mostraAvviso('Non si è fermato' + (j && j.errore ? ': ' + j.errore : '. Riprova.'), true);
      });
    }, function () {
      mostraAvviso('Non si è fermato: il pannello non risponde.', true);
    }).then(function () { inCorso = false; aggiorna(); });
  }

  /* la prima volta si riprova finché il server risponde */
  window.DATI_PRONTI = new Promise(function (pronto) {
    function prova() {
      Promise.all([giro(), prendi('/api/su-misura').catch(function () { return {}; })]).then(function (x) {
        nascondiAvviso();
        window.DATI = x[0];
        window.REDACY_MISURA = x[1] || {};
        if (window.Contenuti) {
          window.Contenuti.suFerma = ferma;
          if (window.Contenuti.carica) window.Contenuti.carica(x[0]);
        }
        setInterval(function () { if (!document.hidden) aggiorna(); }, OGNI);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) aggiorna(); });
        pronto(x[0]);
      }, function () {
        mostraAvviso('Non riesco a leggere lo studio. Riprovo da solo; se dura, riaccendi il pannello.');
        setTimeout(prova, 2000);
      });
    }
    prova();
  });
})();

</script>

    else { corpo(); setTimeout(fine, MS()); setHash(id); }
  }

  /* avvicina e allontana: stessa mossa, la finestra cresce quasi a tutto schermo e torna */
  function vicinoVai(on) {
    if (!aperto || on === vicino) return;
    var f = F[aperto]; if (!f.pronto) return;
    var g = ++gen, L = geometria(aperto, on), Wn = L.panel.Wp, Hn = L.panel.Hp, Wo = f.Wp, Ho = f.Hp;
    vicino = on; document.body.classList.toggle('vicino', on); setVicBtn(on);
    f.pronto = false;
    velaDa(f, Wo, Ho, 'translate(0px,0px) scale(1)');
    var sv = cop(Wn, Hn, Wo, Ho);
    var fineTr = 'translate(' + ((Wn - Wo * sv) / 2).toFixed(2) + 'px,' + ((Hn - Ho * sv) / 2).toFixed(2) + 'px) scale(' + sv.toFixed(4) + ')';
    f.Wp = Wn; f.Hp = Hn;
    f.el.className = 'el pt'; f.mode = 'pt';
    f.el.style.cssText = 'left:50%;top:50%;width:' + Wn + 'px;height:' + Hn + 'px;transform:translate(-50%,-50%)';
    applica(L);
    dissolviFin(f);
    velaVerso(f, fineTr);
    setTimeout(function () {
      if (g !== gen) return;
      f.el.className = 'el pieno'; f.el.style.cssText = ''; f.mode = 'pieno'; velaVia(f); f.pronto = true;
    }, MS());
  }
  function fuori() { if (vicino) vicinoVai(false); else vai(null); }
  function su() {
    if (sheetAperto) { chiudiSupporto(); return; }
    if (!aperto) return;
    if (F[aperto].ist.indietro()) return;
    fuori();
  }

  /* briciole */
  function rendiPercorso() {
    var id = aperto; if (!id) return;
    var f = F[id], lv = livelli[id] && livelli[id].length ? livelli[id] : [f.p.titolo];
    f.brici.innerHTML = '';
    var voci = ['Tutto'].concat(lv);
    voci.forEach(function (t, i) {
      var li = document.createElement('li');
      if (i === voci.length - 1) { var sp = document.createElement('span'); sp.textContent = t; sp.setAttribute('aria-current', 'location'); li.appendChild(sp); }
      else {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = t;
        b.addEventListener('click', function () {
          if (i === 0) { vai(null); return; }
          var passi = lv.length - i; for (var k = 0; k < passi; k++) { if (!f.ist.indietro()) break; }
        });
        li.appendChild(b);
      }
      f.brici.appendChild(li);
    });
  }

  /* il dock: dov'è il puntino, chi è il corrente */
  function rendiDock() {
    var cur = aperto || 'tutto';
    DOCK.forEach(function (b) {
      var on = b.dataset.id === cur;
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      b.tabIndex = on ? 0 : -1;
    });
    var b = DB[cur];
    if (b && b.offsetWidth) punto.style.transform = 'translateX(' + (b.offsetLeft + b.offsetWidth / 2) + 'px)';
  }
  DOCK.forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.dataset.id;
      if (id === 'tutto') { if (aperto) vai(null, { focus: false }); return; }
      if (aperto === id) { var guard = 12; while (guard-- > 0 && F[id].ist.indietro()) {} return; }
      vai(id, { nofocus: true });
    });
    b.addEventListener('focus', function () { DOCK.forEach(function (x) { x.tabIndex = x === b ? 0 : -1; }); });
  });
  document.getElementById('dock').addEventListener('focusout', function (e) { if (!e.relatedTarget || !this.contains(e.relatedTarget)) rendiDock(); });

  /* ---------- montaggio dei contenuti ---------- */
  spazio.addEventListener('contenuti:profondita', function (e) {
    var d = e.detail || {}; if (!F[d.pannello]) return;
    var prima = (livelli[d.pannello] || []).length, ora = (d.livelli || []).length;
    livelli[d.pannello] = d.livelli || [];
    if (d.pannello === aperto) {
      rendiPercorso();
      var f = F[aperto];
      if (f.pronto && f.mode === 'pieno' && prima && ora !== prima && f.el.animate) {
        var piu = ora > prima;
        f.el.animate(REDUCE.matches ? [{ opacity: 0 }, { opacity: 1 }] :
          [{ opacity: 0, transform: piu ? 'scale(.95)' : 'scale(1.04)' }, { opacity: 1, transform: 'none' }],
          { duration: 360, easing: 'cubic-bezier(.22,.8,.24,1)' });
      }
    }
  });
  spazio.addEventListener('contenuti:vai', function (e) {
    var d = e.detail || {}; if (!d.pannello || !F[d.pannello]) return;
    vai(d.pannello, { voce: d.voce, focus: false });
  });

  senzaMoto(function () { applica(geometria(null, false)); rendiDock(); });
  IDS.forEach(function (n) { F[n].ist = Contenuti.monta(n, F[n].el, 'anteprima'); });

  /* ---------- gesti ---------- */
  IDS.forEach(function (n) {
    F[n].btn.addEventListener('click', function () { if (aperto !== n) vai(n); });
    F[n].fin.querySelector('.indietro').addEventListener('click', su);
    F[n].vic.addEventListener('click', function () { vicinoVai(!vicino); });
    F[n].fin.querySelector('.barra').addEventListener('dblclick', function (e) { if (!e.target.closest('button')) vicinoVai(!vicino); });
  });
  document.getElementById('fondo-clic').addEventListener('click', fuori);

  function inCampo(t) { return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); }
  window.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    if (sheetAperto) {
      if (e.key === 'Escape') { e.preventDefault(); chiudiSupporto(); }
      else if (e.key === 'Tab') trappola(e);
      return;
    }
    if (e.key === 'Escape') { if (aperto) { e.preventDefault(); su(); } return; }
    if (inCampo(e.target)) return;
    var k = e.key;
    var inDock = document.activeElement && document.activeElement.closest && document.activeElement.closest('#dock');
    if (inDock && (k === 'ArrowRight' || k === 'ArrowLeft' || k === 'Home' || k === 'End')) {
      var i = DOCK.indexOf(document.activeElement.closest('.d-b')), j = k === 'Home' ? 0 : k === 'End' ? DOCK.length - 1 : (i + (k === 'ArrowRight' ? 1 : -1) + DOCK.length) % DOCK.length;
      e.preventDefault(); DOCK[j].focus(); return;
    }
    if (aperto) {
      if ((k === 'ArrowRight' || k === 'ArrowLeft') && !vicino) {
        var a = IDS.indexOf(aperto), b = (a + (k === 'ArrowRight' ? 1 : -1) + IDS.length) % IDS.length;
        e.preventDefault(); vai(IDS[b], { nofocus: false });
      }
      return;
    }
    var fo = document.activeElement && document.activeElement.closest && document.activeElement.closest('.fin');
    var i0 = fo ? CASA.indexOf(fo.dataset.id) : -1, dest = -1, t = tel();
    if (k === 'ArrowRight') dest = i0 < 0 ? 0 : Math.min(CASA.length - 1, i0 + 1);
    else if (k === 'ArrowLeft') dest = i0 < 0 ? 0 : Math.max(0, i0 - 1);
    else if (k === 'ArrowDown') dest = i0 < 0 ? 0 : (t ? Math.min(CASA.length - 1, i0 + 2 - (i0 === 0 ? 1 : 0)) : (i0 === 0 ? 1 : i0));
    else if (k === 'ArrowUp') dest = i0 < 0 ? 0 : (t ? Math.max(0, i0 - 2 + (i0 === 1 || i0 === 2 ? 1 : 0)) : 0);
    if (dest >= 0) { e.preventDefault(); F[CASA[dest]].btn.focus(); }
  });

  // pizzico: stringere allontana (poi torna a Tutto), allargare avvicina. Trackpad (ctrl + rotella), Safari (gesture), due dita sullo schermo
  function gestoProprio(el) {
    for (; el && el !== document.body && el.nodeType === 1; el = el.parentNode) { if (getComputedStyle(el).touchAction === 'none') return true; }
    return false;
  }
  var acc = 0, accT = 0, blocco = 0;
  window.addEventListener('wheel', function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    if (!aperto || sheetAperto) return;
    var now = performance.now(); if (now - accT > 350) acc = 0; accT = now;
    acc += e.deltaY;
    if (now > blocco && acc > 50) { acc = 0; blocco = now + 650; fuori(); }
    else if (now > blocco && acc < -50) { acc = 0; blocco = now + 650; if (!vicino) vicinoVai(true); }
  }, { passive: false });
  var gesto = false;
  window.addEventListener('gesturestart', function (e) { gesto = false; e.preventDefault(); });
  window.addEventListener('gesturechange', function (e) {
    e.preventDefault(); if (gesto || !aperto || sheetAperto) return;
    if (e.scale < .8) { gesto = true; fuori(); } else if (e.scale > 1.25 && !vicino) { gesto = true; vicinoVai(true); }
  });
  var d0 = 0, fatto = false, proprio = false;
  var dist = function (t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); };
  window.addEventListener('touchstart', function (e) { if (e.touches.length === 2) { d0 = dist(e.touches); fatto = false; proprio = gestoProprio(e.target); } }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2 || !d0 || fatto || !aperto || proprio || sheetAperto) return;
    var r = dist(e.touches) / d0;
    if (r < .78) { fatto = true; fuori(); } else if (r > 1.3 && !vicino) { fatto = true; vicinoVai(true); }
  }, { passive: true });

  window.addEventListener('hashchange', function () {
    var h = location.hash.replace('#', '');
    if (h === 'supporto') { apriSupporto(); return; }
    var dest = F[h] ? h : null;
    if ((h === 'tutto' || F[h] || h === '') && dest !== aperto) vai(dest);
  });
  var rr; window.addEventListener('resize', function () {
    clearTimeout(rr); rr = setTimeout(function () {
      var L = geometria(aperto, vicino); if (aperto) { F[aperto].Wp = L.panel.Wp; F[aperto].Hp = L.panel.Hp; }
      senzaMoto(function () { applica(L); rendiDock(); });
    }, 80);
  });

  /* ---------- il foglio del supporto umano ---------- */
  var sheetAperto = false, sheetFuoco = null;
  var fogF = document.getElementById('supporto-f'), fogC = document.getElementById('sup-corpo'), fogLink = document.getElementById('sup-link'), fogEsito = document.getElementById('sup-esito');
  function suppDati() { return dato().supporto || {}; }
  function riempiSupporto() {
    var s = suppDati(), t = typeof s.testo === 'string' ? s.testo : '';
    fogLink.href = s.url || 'https://redacy.com';
    var cur = fogC.firstChild;
    if (t) {
      if (!cur || cur.tagName !== 'PRE') { fogC.replaceChildren(); var pre = document.createElement('pre'); pre.id = 'sup-pre'; pre.tabIndex = 0; pre.setAttribute('aria-label', 'Riepilogo dello studio'); fogC.appendChild(pre); cur = pre; }
      if (cur.textContent !== t) cur.textContent = t;
    } else if (!cur || cur.tagName === 'PRE') {
      fogC.replaceChildren(); var p = document.createElement('p'); p.className = 'manca'; p.textContent = 'Il riepilogo dello studio non è disponibile in questo momento.'; fogC.appendChild(p);
    }
  }
  function apriSupporto() {
    if (sheetAperto) return;
    sheetAperto = true; sheetFuoco = document.activeElement;
    riempiSupporto(); fogEsito.textContent = '';
    fogF.classList.add('aperto'); fogF.setAttribute('aria-hidden', 'false');
    setTimeout(function () { document.getElementById('sup-t').focus({ preventScroll: true }); }, 30);
  }
  function chiudiSupporto() {
    if (!sheetAperto) return;
    sheetAperto = false; fogF.classList.remove('aperto'); fogF.setAttribute('aria-hidden', 'true');
    if (location.hash === '#supporto') setHash(aperto);
    var f = sheetFuoco; sheetFuoco = null;
    if (f && f.focus && document.contains(f)) f.focus({ preventScroll: true });
  }
  function trappola(e) {
    var els = Array.prototype.filter.call(fogF.querySelectorAll('button, a[href], pre[tabindex]'), function (x) { return x.offsetParent !== null; });
    if (!els.length) return;
    var a = document.activeElement, i = els.indexOf(a);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); els[els.length - 1].focus(); }
    else if (!e.shiftKey && (i === els.length - 1)) { e.preventDefault(); els[0].focus(); }
    else if (i < 0) { e.preventDefault(); els[0].focus(); }
  }
  function selezionaRiepilogo() {
    var pre = document.getElementById('sup-pre'); if (!pre) return;
    try { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  }
  function copiaRiepilogo(t) {
    var ok = function () { fogEsito.textContent = 'Riepilogo copiato. Incollalo nella richiesta su redacy.com.'; };
    var no = function () { fogEsito.textContent = 'Seleziona il riepilogo e copialo.'; };
    var vecchio = function () { selezionaRiepilogo(); var r = false; try { r = document.execCommand('copy'); } catch (e) {} if (r) ok(); else no(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, vecchio);
      else vecchio();
    } catch (e) { vecchio(); }
  }
  fogLink.addEventListener('click', function () {      // non ferma il link: copia e lascia andare
    var t = suppDati().testo;
    if (typeof t === 'string' && t) copiaRiepilogo(t); else fogEsito.textContent = 'Non c’è un riepilogo da copiare: racconta tu cosa serve nella richiesta.';
  });
  document.getElementById('sup-x').addEventListener('click', chiudiSupporto);
  document.getElementById('sup-chiudi').addEventListener('click', chiudiSupporto);
  fogF.addEventListener('click', function (e) { if (e.target === fogF) chiudiSupporto(); });
  document.getElementById('supp-b').addEventListener('click', apriSupporto);

  /* ---------- la casa: la prova dei cinque secondi, e i numeri vivi ---------- */
  function saluto() {
    var S = dato(), c = S.conta || {}, n = c.per_te || 0, lavora = c.in_corso || 0;
    titoloStudio();
    if (!MISURA.frase) { document.getElementById('saluto').hidden = true; var b0 = document.querySelector('.badge'); if (b0) b0.textContent = n; return; }
    document.getElementById('saluto').hidden = false;
    try { var r = Contenuti.riassunto('oggi'); if (r && typeof r.numero === 'number') n = r.numero; } catch (e) {}
    var tardi = ((S.periodo && S.periodo.aspettano_te) || []).filter(function (x) { return x.in_ritardo; }).length;
    var nm = (S.cartella && S.cartella.nome) || '';
    var elN = document.getElementById('s-nome'); if (elN.textContent !== nm) elN.textContent = nm;
    var tt = n === 0 ? 'Niente aspetta te' : n + (n === 1 ? ' cosa per te' : ' cose per te'), elT = document.getElementById('s-t');
    if (elT.textContent !== tt) elT.textContent = tt;
    var p = document.getElementById('s-p');
    var a = lavora === 0 ? 'Niente sta lavorando adesso' : (lavora === 1 ? '1 sta lavorando' : lavora + ' stanno lavorando');
    try { var rr2 = Contenuti.riassunto('oggi'); if (rr2 && rr2.righe) a = rr2.righe.filter(function (x) { return !/in ritardo/.test(x); }).join(' · ') || a; } catch (e) {}
    if (p.dataset.t !== a + tardi) {
      p.dataset.t = a + tardi;
      p.textContent = a;
      if (tardi) { var sp = document.createElement('span'); sp.className = 'tardi'; sp.textContent = tardi === 1 ? '1 in ritardo' : tardi + ' in ritardo'; p.appendChild(sp); }
    }
    var b = document.querySelector('.badge'); if (b && b.textContent !== String(n)) b.textContent = n;
  }
  /* i bagliori delle piastrelle e gli stati nel dock */
  function aggiornaStati() {
    IDS.forEach(function (n) {
      var r = null; try { r = Contenuti.riassunto(n); } catch (e) {}
      var st = (r && r.stato) || 'calmo', f = F[n], b = DB[n];
      if (f.fin.dataset.stato !== st) f.fin.dataset.stato = st;
      if (b.dataset.stato !== st) b.dataset.stato = st;
      var tx = r && typeof r.numero === 'number' ? ', ' + r.numero + ' ' + (r.etichetta || '') : '';
      var sr = b.querySelector('.sr'); if (sr.textContent !== tx) sr.textContent = tx;
    });
  }
  function aggiornaTutto() { saluto(); aggiornaStati(); if (sheetAperto) riempiSupporto(); }
  document.addEventListener('contenuti:dati', aggiornaTutto);
  aggiornaTutto();
  setInterval(aggiornaTutto, 1500);      // il contenuto aggiorna da sé le sue istanze: qui si legge solo il risultato

  /* ---------- avvio ---------- */
  metti(sfondo);
  var h0 = location.hash.replace('#', '');
  if (F[h0]) vai(h0, { istante: true, nofocus: true }); else setHash(null);
  if (h0 === 'supporto') { setHash(null); apriSupporto(); }
  window.requestAnimationFrame(rendiDock);
}
