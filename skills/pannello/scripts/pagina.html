<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; connect-src 'self'">
<meta name="redacy-gettone" content="{{GETTONE}}">
<title>Pannello · redacy</title>
<style>
/* Colori: tema chiaro qui, tema scuro sotto (segue il sistema, oppure l'interruttore) */
:root {
  color-scheme: light;
  --sfondo: #f4f0ea;
  --carta: #fffdf8;
  --testo: #24261e;
  --secondario: #64665a;
  --linea: rgba(57,60,43,.18);
  --accento: #cd642f;
  --accento-testo: #a94a1c;
  --su-accento: #ffffff;
  --vivo: #43775e;
  --ferma: #a6462c;
  --morbido: #ede7dd;
  --isola: #e3dfd3;
  --lato-isola: #cfc9bb;
  --pagina-studio: #d68753;
  --area-1: #718d7a;
  --area-2: #6f86a0;
  --area-3: #b79a52;
  --area-4: #93708a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --sfondo: #191a17;
    --carta: #22231f;
    --testo: #ece8df;
    --secondario: #a6a396;
    --linea: rgba(236,232,223,.14);
    --accento: #e3804c;
    --accento-testo: #e3804c;
    --su-accento: #191a17;
    --vivo: #6fa487;
    --ferma: #d0694c;
    --morbido: #2b2c27;
    --isola: #2c2d28;
    --lato-isola: #23241f;
    --pagina-studio: #e39a68;
    --area-1: #86a692;
    --area-2: #88a0bc;
    --area-3: #cdb26b;
    --area-4: #ae8aa6;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --sfondo: #191a17;
  --carta: #22231f;
  --testo: #ece8df;
  --secondario: #a6a396;
  --linea: rgba(236,232,223,.14);
  --accento: #e3804c;
  --accento-testo: #e3804c;
  --su-accento: #191a17;
  --vivo: #6fa487;
  --ferma: #d0694c;
  --morbido: #2b2c27;
  --isola: #2c2d28;
  --lato-isola: #23241f;
  --pagina-studio: #e39a68;
  --area-1: #86a692;
  --area-2: #88a0bc;
  --area-3: #cdb26b;
  --area-4: #ae8aa6;
}

/* Base */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--sfondo);
  color: var(--testo);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
:focus-visible { outline: 2px solid var(--accento); outline-offset: 2px; }
h1 { font-size: 24px; line-height: 1.2; font-weight: 700; margin: 0 0 20px; }
h2 { font-size: 16px; line-height: 1.3; font-weight: 700; margin: 28px 0 10px; }
h3 { font-size: 15px; line-height: 1.3; font-weight: 700; margin: 0; }
p { margin: 0 0 10px; }
.piccolo { font-size: 13px; color: var(--secondario); }
.etichetta { font-size: 13px; font-weight: 700; color: var(--secondario); margin: 0 0 4px; }
.percorso { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; color: var(--secondario); overflow-wrap: anywhere; }
.tono-ok { color: var(--vivo); font-weight: 700; }
.tono-no { color: var(--ferma); font-weight: 700; }
.tono-giro { color: var(--accento-testo); font-weight: 700; }
.tono-te { color: var(--accento-testo); font-weight: 700; }
.tono-neutro { color: var(--secondario); font-weight: 700; }

/* Loghi: i neri nel tema chiaro, i bianchi nello scuro */
.per-scuro { display: none !important; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .per-chiaro { display: none !important; }
  :root:not([data-theme="light"]) .per-scuro { display: block !important; }
}
:root[data-theme="dark"] .per-chiaro { display: none !important; }
:root[data-theme="dark"] .per-scuro { display: block !important; }

/* Marchio: segno R, nome, ora */
.marchio { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marchio img { height: 24px; width: auto; display: block; flex: none; }
.marchio .nome-studio { font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.marchio .aggiornato { font-size: 13px; color: var(--secondario); line-height: 1.3; }

/* Bottone di supporto */
.btn-supporto, .btn-primario {
  display: inline-block; text-decoration: none; cursor: pointer;
  background: var(--accento-testo); color: var(--su-accento);
  border: 1px solid var(--accento-testo); border-radius: 8px;
  padding: 8px 14px; font-weight: 700; font-size: 15px; line-height: 1.3; text-align: center;
}
.btn-supporto:hover, .btn-primario:hover { filter: brightness(1.08); }

/* Interruttori */
.interruttori { display: flex; flex-direction: column; gap: 10px; }
.interruttore { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; position: relative; }
.interruttore input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.interruttore .cursore { flex: none; width: 38px; height: 22px; border-radius: 11px; background: var(--morbido); border: 1px solid var(--secondario); position: relative; transition: background .15s; }
.interruttore .cursore::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--secondario); transition: transform .15s, background .15s; }
.interruttore input:checked + .cursore { background: var(--accento-testo); border-color: var(--accento-testo); }
.interruttore input:checked + .cursore::after { transform: translateX(16px); background: var(--su-accento); }
.interruttore input:focus-visible + .cursore { outline: 2px solid var(--accento); outline-offset: 2px; }
html[data-movimento="ridotto"] * { transition: none !important; }

/* Menu */
.voci { list-style: none; margin: 0; padding: 0; }
.voce-menu {
  display: grid; grid-template-columns: 30px 1fr; column-gap: 6px; align-items: baseline;
  width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent;
  border-radius: 6px; padding: 8px 10px; cursor: pointer;
}
.voce-menu:hover { background: var(--morbido); }
.voce-menu[aria-current="page"] { background: var(--morbido); border-left-color: var(--accento); }
.voce-menu .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; color: var(--secondario); grid-row: 1; }
.voce-menu .nome { font-weight: 600; grid-column: 2; }
.voce-menu .conta { font-size: 13px; color: var(--secondario); grid-column: 2; }
.voce-menu .corto { display: none; }

/* Scena */
.scena { position: relative; background: var(--sfondo); height: 42vh; min-height: 260px; overflow: hidden; }
#tela { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
#tela.afferrata { cursor: grabbing; }
#tela.sopra-pagina { cursor: pointer; }

/* Colonna del capitolo */
.colonna-testa { display: flex; justify-content: flex-end; padding: 14px 24px; }
.colonna-corpo { padding: 0 24px 40px; }
.capitolo > :first-child { margin-top: 0; }

/* Elenchi e schede */
.scheda { background: var(--carta); border: 1px solid var(--linea); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; }
.lista { list-style: none; margin: 0; padding: 0; }
.lista > li { padding: 10px 0; border-top: 1px solid var(--linea); }
.lista > li:first-child { border-top: 0; padding-top: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--secondario); margin-top: 2px; }
.obiettivo { font-size: 17px; font-weight: 600; line-height: 1.35; margin: 0 0 2px; }
.recente { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--linea); }
.recente:first-of-type { border-top: 0; }
.recente .quando { font-size: 13px; color: var(--secondario); }

/* Passi di una corsa */
.passi { list-style: none; margin: 10px 0 0; padding: 0; }
.passi > li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--linea); }
.passi .nome-passo { font-weight: 600; }
.passi .stato { font-size: 13px; text-align: right; }
.passi .dettaglio { font-size: 13px; color: var(--secondario); grid-column: 1 / -1; }
.passi .ora { font-weight: 400; color: var(--secondario); font-size: 13px; margin-left: 8px; }
.testa-corsa { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.azione-ferma { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.btn-secondario {
  background: var(--carta); color: var(--testo); border: 1px solid var(--secondario);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 15px; line-height: 1.3;
}
.btn-secondario:hover { background: var(--morbido); }
.btn-ferma { border-color: var(--ferma); color: var(--ferma); font-weight: 700; }
.btn-ferma-conferma { background: var(--ferma); border-color: var(--ferma); color: #fff; font-weight: 700; }
.btn-ferma-conferma:hover { background: var(--ferma); filter: brightness(1.08); }
.btn-link { background: none; border: 0; padding: 0; color: var(--accento-testo); text-decoration: underline; cursor: pointer; font-size: 13px; font-weight: 700; }
.riga-ultima { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; background: none; border: 0; text-align: left; padding: 0; cursor: pointer; align-items: baseline; }
.riga-ultima .nome-corsa { font-weight: 600; }
.riga-ultima .piccolo { grid-column: 1 / -1; }
.riga-ultima::before { content: none; }
.dettaglio-corsa { margin-top: 6px; }

/* Memoria */
.filtri { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.filtro { background: var(--carta); border: 1px solid var(--linea); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.filtro[aria-pressed="true"] { background: var(--testo); color: var(--sfondo); border-color: var(--testo); }
.conti { color: var(--secondario); font-size: 13px; margin: 0 0 4px; }
.pagina-scelta h2 { margin-top: 0; font-size: 20px; }
.bottoni-pagine { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; padding: 0; list-style: none; }
.bottone-pagina { background: var(--carta); border: 1px solid var(--linea); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; text-align: left; }
.bottone-pagina:hover { background: var(--morbido); }
.bottone-pagina.manca { border-style: dashed; color: var(--secondario); }
.etichetta-manca { display: inline-block; font-size: 13px; font-weight: 700; color: var(--accento-testo); border: 1px dashed var(--accento-testo); border-radius: 6px; padding: 0 8px; margin-bottom: 6px; }
.punto-area { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }

/* Aree e processi */
.area { width: 100%; text-align: left; display: block; cursor: pointer; font: inherit; color: inherit; }
.area[aria-pressed="true"] { border-color: var(--accento); box-shadow: 0 0 0 1px var(--accento); }
.area .serve { margin: 2px 0 6px; }
.area .conti-area { display: flex; flex-wrap: wrap; gap: 0 14px; font-size: 13px; color: var(--secondario); }
.area .processi-area { font-size: 13px; margin-top: 4px; }
.testa-processo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.innesco { margin: 6px 0 2px; }
.disegno-passi { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 0; margin: 12px 0 8px; }
.col-con-freccia { display: flex; align-items: center; flex: 1 1 124px; min-width: 124px; max-width: 50%; }
.colonna-passi { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.riquadro-passo { border: 1px solid var(--linea); background: var(--morbido); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.riquadro-passo .nome-passo { font-size: 13px; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; }
.riquadro-passo .sotto { font-size: 13px; color: var(--secondario); line-height: 1.3; overflow-wrap: break-word; }
.freccia { flex: none; width: 20px; color: var(--secondario); font-size: 15px; text-align: center; }

/* Redacy */
.logo-lungo { display: block; width: 180px; height: auto; margin: 0 0 20px; }
pre.riepilogo { background: var(--carta); border: 1px solid var(--linea); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.esito-copia { min-height: 1.5em; margin: 10px 0 0; }

/* Mobile: una colonna, menu fisso in basso */
.app { padding-bottom: 66px; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; position: sticky; top: 0; z-index: 20; background: var(--sfondo); border-bottom: 1px solid var(--linea); }
.barra .btn-supporto { margin-left: auto; }
.menu { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--carta); border-top: 1px solid var(--linea); }
.menu .menu-testa, .menu .menu-fondo { display: none; }
.menu .voci { display: grid; grid-template-columns: repeat(5, 1fr); }
.menu .voce-menu { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; border-left: 0; border-top: 3px solid transparent; border-radius: 0; padding: 6px 2px 8px; min-height: 58px; text-align: center; }
.menu .voce-menu[aria-current="page"] { border-top-color: var(--accento); border-left-color: transparent; }
.menu .voce-menu .lungo, .menu .voce-menu .conta { display: none; }
.menu .voce-menu .corto { display: inline; font-size: 13px; }
.colonna-testa { display: none; }
.colonna { padding: 18px 16px 12px; }
.colonna-corpo { padding: 0 0 20px; }
.posto-interruttori-mobile { padding: 16px 0 8px; border-top: 1px solid var(--linea); margin-top: 8px; }

/* Desktop: tre colonne alte quanto la finestra */
@media (min-width: 1000px) {
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr) 440px; height: 100vh; height: 100dvh; overflow: hidden; padding-bottom: 0; }
  .barra { display: none; }
  .menu { position: static; display: flex; flex-direction: column; border-top: 0; border-right: 1px solid var(--linea); background: var(--sfondo); padding: 18px 10px 16px; min-height: 0; overflow-y: auto; }
  .menu .menu-testa { display: block; padding: 0 8px 22px; }
  .menu .menu-fondo { display: block; margin-top: auto; padding: 18px 8px 0; border-top: 1px solid var(--linea); }
  .menu .voci { display: block; }
  .menu .voce-menu { display: grid; grid-template-columns: 30px 1fr; align-items: baseline; justify-content: stretch; column-gap: 6px; text-align: left; border-top: 0; border-left: 3px solid transparent; border-radius: 6px; padding: 8px 10px; min-height: 0; margin-bottom: 2px; }
  .menu .voce-menu[aria-current="page"] { border-left-color: var(--accento); }
  .menu .voce-menu .lungo { display: inline; }
  .menu .voce-menu .conta { display: block; }
  .menu .voce-menu .corto { display: none; }
  .scena { height: auto; min-height: 0; }
  #tela { touch-action: none; }
  .colonna { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; background: var(--carta); border-left: 1px solid var(--linea); padding: 0; }
  .colonna-testa { display: flex; position: sticky; top: 0; z-index: 5; background: var(--carta); border-bottom: 1px solid var(--linea); }
  .colonna-corpo { padding: 22px 24px 40px; }
  .scheda { background: var(--sfondo); }
  .posto-interruttori-mobile { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="barra" id="barra"></header>

  <nav class="menu" id="menu" aria-label="Capitoli">
    <div class="menu-testa" id="posto-marchio"></div>
    <ul class="voci" id="voci"></ul>
    <div class="menu-fondo" id="posto-interruttori-desktop"></div>
  </nav>

  <main class="scena" id="scena">
    <canvas id="tela" role="img" aria-label="Lo studio in 3D: aree di lavoro, pagine della memoria e processi"></canvas>
  </main>

  <div class="colonna" id="colonna">
    <div class="colonna-testa" id="posto-supporto-desktop"></div>
    <div class="colonna-corpo">
      <section class="capitolo" id="cap-insieme" data-cap="insieme" hidden></section>
      <section class="capitolo" id="cap-agenti" data-cap="agenti" hidden></section>
      <section class="capitolo" id="cap-memoria" data-cap="memoria" hidden></section>
      <section class="capitolo" id="cap-aree" data-cap="aree" hidden></section>
      <section class="capitolo" id="cap-redacy" data-cap="redacy" hidden></section>
      <div class="posto-interruttori-mobile" id="posto-interruttori-mobile"></div>
    </div>
  </div>

</div>

<script id="dati">
// I dati arrivano dal server del pannello (GET /api/stato), nella stessa forma dei dati finti del prototipo.
let DATI = null;
const GETTONE = (document.querySelector('meta[name="redacy-gettone"]') || {}).content || '';
function caricaDati() {
  return fetch('/api/stato', { cache: 'no-store', headers: { 'Accept': 'application/json' } })
    .then((r) => { if (!r.ok) throw new Error('stato ' + r.status); return r.json(); })
    .then((d) => { DATI = d; return d; });
}
</script>

<script id="lettura">
/* LETTURA: funzioni pure. Prendono DATI e restituiscono la vista. Nessun accesso al DOM. */
const LETTURA = (() => {
  const FUSO = 'Europe/Rome';
  const fmtParti = new Intl.DateTimeFormat('it-IT', { timeZone: FUSO, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });

  const fmtLungo = new Intl.DateTimeFormat('it-IT', { timeZone: FUSO, day: 'numeric', month: 'long', year: 'numeric' });

  // ---------- ore e date (fuso di Roma, «adesso» è DATI.ora) ----------
  function inData(valore) {
    return new Date(valore.length === 10 ? valore + 'T12:00:00Z' : valore);
  }
  function parti(valore) {
    const d = inData(valore);
    const o = {};
    for (const p of fmtParti.formatToParts(d)) o[p.type] = p.value;
    return { giorno: o.year + '-' + o.month + '-' + o.day, ora: o.hour + ':' + o.minute };
  }
  function giornoCorto(valore) {
    const o = {};
    for (const p of fmtGiorno.formatToParts(inData(valore))) o[p.type] = p.value.replace('.', '');
    return o.weekday + ' ' + o.day + ' ' + o.month;
  }
  function giorniFra(da, a) {
    const t = (g) => Date.UTC(+g.slice(0, 4), +g.slice(5, 7) - 1, +g.slice(8, 10));
    return Math.round((t(a) - t(da)) / 86400000);
  }
  // «oggi 10:00», «ieri 17:12», «lun 2 nov 08:30» (con 'alle': «oggi alle 10:00»)
  function quandoLocale(giorno, hhmm, ora, alle) {
    const diff = giorniFra(giorno, parti(ora).giorno);
    const ponte = alle ? ' alle ' : ' ';
    if (diff === 0) return 'oggi' + ponte + hhmm;
    if (diff === 1) return 'ieri' + ponte + hhmm;
    return giornoCorto(giorno) + ponte + hhmm;
  }
  function quando(iso, ora, alle) {
    const p = parti(iso);
    return quandoLocale(p.giorno, p.ora, ora, alle);
  }
  function oraHM(iso) { return parti(iso).ora; }
  function minutiDa(iso, ora) { return (new Date(ora) - new Date(iso)) / 60000; }
  function durata(min) {
    const m = Math.max(1, Math.round(min));
    return m >= 120 ? Math.round(m / 60) + ' h' : m + ' min';
  }
  function dataLunga(ora) {
    return fmtLungo.format(new Date(ora)) + ', ' + parti(ora).ora;
  }
  // scadenze: «scaduta ieri», «scaduta il 3 nov», «scade oggi», «entro gio 12 nov»
  function scadenza(giorno, ora) {
    const diff = giorniFra(giorno, parti(ora).giorno); // > 0 = nel passato
    if (diff === 1) return { testo: 'scaduta ieri', scaduta: true };
    if (diff > 1) return { testo: 'scaduta il ' + giornoCorto(giorno).split(' ').slice(1).join(' '), scaduta: true };
    if (diff === 0) return { testo: 'scade oggi', scaduta: false, oggi: true };
    return { testo: 'entro ' + giornoCorto(giorno), scaduta: false };
  }

  // ---------- parole ----------
  function nomeLeggibile(id) {
    const s = String(id).replace(/-/g, ' ');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function plurale(n, uno, molti) { return n + ' ' + (n === 1 ? uno : molti); }
  function statoCorsa(c, ora) {
    if (c.stato === 'in-corso' && c.stop_richiesto) return 'fermata';
    if (c.stato === 'in-corso' && minutiDa(c.ultimo_segno, ora) > c.persa_dopo_minuti) return 'persa';
    return c.stato;
  }
  function avviatoDa(c) {
    const h = oraHM(c.inizio);
    if (c.avviato_da === 'attivita-claude' || c.avviato_da === 'automazione-codex') return 'partito da solo alle ' + h;
    if (c.avviato_da === 'conversazione') return 'partito da te in chat alle ' + h;
    return 'partito da te alle ' + h;
  }
  const PAROLE_PASSO = { 'da-fare': 'da fare', 'in-corso': 'sta girando', 'fatto': 'fatto', 'fallito': 'non riuscito', 'fermato': 'fermato', 'saltato': 'saltato' };
  function tonoPasso(stato) {
    return { 'fatto': 'ok', 'in-corso': 'giro', 'fallito': 'no' }[stato] || 'neutro';
  }
  function esitoCorsa(c, ora) {
    const s = statoCorsa(c, ora);
    if (s === 'finita') return { testo: 'fatto', tono: 'ok' };
    if (s === 'fallita') return { testo: 'non riuscito', tono: 'no' };
    if (s === 'fermata') return { testo: 'fermato da te', tono: 'neutro' };
    if (s === 'persa') return { testo: 'non dà notizie', tono: 'no' };
    return { testo: 'sta girando', tono: 'giro' };
  }
  function indiceCorrente(c) {
    let i = c.passi.findIndex((p) => p.stato === 'in-corso');
    if (i < 0) i = c.passi.findIndex((p) => p.stato === 'da-fare');
    return i;
  }

  // ---------- processi ----------
  function grafoPerId(dati, id) { return dati.grafi.find((g) => g.grafo === id); }
  function nomePasso(grafo, passoId) {
    const p = grafo && grafo.passi.find((x) => x.id === passoId);
    return p && p.nome ? p.nome : String(passoId).replace(/-/g, ' ');
  }
  function titoloArea(dati, nome) {
    const w = dati.workspace.find((x) => x.nome === nome);
    return w ? w.titolo : nomeLeggibile(nome);
  }
  // etichetta sotto un passo: area, «studio» o «tu»
  function sottoPasso(dati, grafo, i) {
    const p = grafo.passi[i];
    if (p.tipo === 'umano') return 'tu';
    if (p.tipo === 'cli') return 'studio';
    if (p.tipo === 'agente') return p.workspace === 'orchestratore' ? 'studio' : titoloArea(dati, p.workspace);
    return i > 0 ? sottoPasso(dati, grafo, i - 1) : 'studio'; // uscita: come il passo prima
  }
  // colonne del disegno, dagli archi (dopo, o il passo prima se dopo manca)
  function colonneGrafo(grafo) {
    const col = {};
    grafo.passi.forEach((p, i) => {
      const dopo = p.dopo && p.dopo.length ? p.dopo : (i > 0 ? [grafo.passi[i - 1].id] : []);
      col[p.id] = dopo.length ? 1 + Math.max(...dopo.map((d) => (col[d] === undefined ? 0 : col[d]))) : 0;
    });
    const n = Math.max(...Object.values(col)) + 1;
    const colonne = Array.from({ length: n }, () => []);
    grafo.passi.forEach((p, i) => colonne[col[p.id]].push(i));
    return colonne;
  }
  function ultimaCorsa(dati, grafoId) {
    let u = null;
    for (const c of dati.corse) if (c.grafo === grafoId && (!u || c.inizio > u.inizio)) u = c;
    return u;
  }
  function innescoTesto(g) {
    const i = g.innesco;
    if (i.tipo === 'orario') return { prima: i.quando.replace(/\s+Europe\/Rome$/, ''), file: null };
    if (i.tipo === 'evento') return { prima: 'quando arriva un file in ', file: i.file };
    return { prima: 'quando lo chiedi', file: null };
  }
  function processiDellArea(dati, nomeArea) {
    return dati.grafi.filter((g) => g.passi.some((p) => p.tipo === 'agente' && p.workspace === nomeArea));
  }

  // ---------- corse ----------
  function vistaCorsa(dati, c) {
    const g = grafoPerId(dati, c.grafo);
    const stato = statoCorsa(c, dati.ora);
    const idx = indiceCorrente(c);
    const passi = c.passi.map((p, i) => {
      const gp = g ? g.passi.find((x) => x.id === p.id) : null;
      const tocca = gp && gp.tipo === 'umano' && p.stato === 'da-fare' && c.stato === 'in-corso';
      const dett = [p.esito, p.nota].filter(Boolean).join(' · ');
      const t = p.fine || p.inizio;
      return {
        id: p.id, nome: nomePasso(g, p.id),
        parola: tocca ? 'tocca a te' : PAROLE_PASSO[p.stato],
        tono: tocca ? 'te' : tonoPasso(p.stato),
        dettaglio: dett, ora: t ? oraHM(t) : '', dove: tocca ? gp.dove : '',
        fallito: p.stato === 'fallito'
      };
    });
    const persa = stato === 'persa';
    const segnale = persa
      ? 'non dà notizie da ' + durata(minutiDa(c.ultimo_segno, dati.ora))
      : 'ultimo segnale ' + durata(minutiDa(c.ultimo_segno, dati.ora)) + ' fa';
    return {
      id: c.id, grafoId: c.grafo, nome: nomeLeggibile(c.grafo), stato, persa,
      avviato: avviatoDa(c),
      passoDi: idx >= 0 ? 'passo ' + (idx + 1) + ' di ' + c.passi.length : '',
      indice: idx, segnale,
      esito: esitoCorsa(c, dati.ora),
      quando: quando(c.inizio, dati.ora),
      fermataDaPannello: c.stop && c.stop.chi === 'pannello' ? oraHM(c.stop.quando) : '',
      passi
    };
  }
  // l'ultimo problema (corsa non riuscita o che non dà notizie), il più recente
  function problemi(dati) {
    const lista = [];
    for (const c of dati.corse) {
      const g = grafoPerId(dati, c.grafo);
      const s = statoCorsa(c, dati.ora);
      if (s === 'fallita') {
        const p = c.passi.find((x) => x.stato === 'fallito');
        const t = (p && p.fine) || c.fine || c.ultimo_segno;
        lista.push({ corsaId: c.id, tempo: t, nome: nomeLeggibile(c.grafo), quando: quando(t, dati.ora, true), passo: p ? nomePasso(g, p.id) : '', nota: p ? (p.nota || p.esito || '') : '' });
      } else if (s === 'persa') {
        lista.push({ corsaId: c.id, tempo: c.ultimo_segno, nome: nomeLeggibile(c.grafo), quando: quando(c.ultimo_segno, dati.ora, true), passo: '', nota: 'non dà notizie da ' + durata(minutiDa(c.ultimo_segno, dati.ora)) });
      }
    }
    lista.sort((a, b) => (a.tempo < b.tempo ? 1 : -1));
    return lista;
  }
  function rigaProblema(pr, etichetta) {
    let r = etichetta + ': ' + pr.nome + ', ' + pr.quando;
    if (pr.passo) r += ', al passo «' + pr.passo + '»';
    if (pr.nota) r += ': ' + pr.nota;
    return r;
  }

  // ---------- cose da fare ----------
  function gruppiTodo(dati) {
    const oggi = parti(dati.ora).giorno;
    const aperte = dati.periodo.todo.todo.filter((t) => t.stato !== 'fatto');
    const chiavi = ['tu', 'agente'];
    for (const t of aperte) if (!chiavi.includes(t.chi)) chiavi.push(t.chi);
    const chiave = (t) => (t.stato === 'ferma' ? '9999-99' : (t.scadenza || '9999-98'));
    return chiavi.map((chi) => {
      const voci = aperte.filter((t) => t.chi === chi).sort((a, b) => (chiave(a) < chiave(b) ? -1 : chiave(a) > chiave(b) ? 1 : 0)).map((t) => {
        let etichetta = null;
        if (t.stato === 'ferma') etichetta = { testo: 'ferma', tono: 'neutro' };
        else if (t.scadenza) {
          const s = scadenza(t.scadenza, dati.ora);
          etichetta = { testo: s.testo, tono: s.scaduta ? 'no' : (s.oggi ? 'te' : 'neutro') };
        }
        return { id: t.id, cosa: t.cosa, etichetta, nota: t.nota || '', dove: t.dove || '', scaduta: !!(t.scadenza && t.stato !== 'ferma' && t.scadenza < oggi) };
      });
      const titolo = chi === 'tu' ? 'Tocca a te' : chi === 'agente' ? 'Tocca agli agenti AI' : 'Tocca a ' + chi;
      return { chi, titolo, voci };
    }).filter((g) => g.chi === 'tu' || g.voci.length);
  }
  function recente(dati) {
    return dati.log.map((r) => {
      const m = /^-\s*(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})\s*·\s*[^·]*·\s*(.*)$/.exec(r);
      return m ? { quando: quandoLocale(m[1], m[2], dati.ora), frase: m[3] } : { quando: '', frase: r };
    });
  }

  // ---------- la memoria e i suoi collegamenti ----------
  // Una pagina si identifica col suo percorso (due aree possono avere lo stesso nome di file).
  function memoria(dati) {
    const pagine = dati.memoria.map((p) => ({ chiave: p.dove, id: p.id, area: p.area, titolo: p.titolo, riga: p.riga, dove: p.dove, esce: [], entra: [], vicine: new Set(), mancante: false }));
    const perChiave = new Map(pagine.map((p) => [p.chiave, p]));
    const mancanti = new Map();
    const coppie = new Set();
    // un [[nome]] si risolve nella stessa area, poi nello studio, poi in qualunque area
    function risolvi(nome, area) {
      const cand = pagine.filter((p) => p.id === nome);
      if (!cand.length) return null;
      return cand.find((p) => p.area === area) || cand.find((p) => p.area === 'studio') || cand[0];
    }
    dati.memoria.forEach((src) => {
      const da = perChiave.get(src.dove);
      for (const nome of src.collegamenti) {
        const dest = risolvi(nome, src.area);
        if (dest) {
          if (dest === da) continue;
          if (!da.esce.includes(dest.chiave)) da.esce.push(dest.chiave);
          if (!dest.entra.includes(da.chiave)) dest.entra.push(da.chiave);
          da.vicine.add(dest.chiave); dest.vicine.add(da.chiave);
          coppie.add([da.chiave, dest.chiave].sort().join('\u0000'));
        } else {
          const k = 'mancante:' + nome;
          if (!mancanti.has(k)) mancanti.set(k, { chiave: k, id: nome, area: src.area, titolo: nomeLeggibile(nome), riga: '', dove: '', esce: [], entra: [], vicine: new Set(), mancante: true });
          const m = mancanti.get(k);
          if (!m.entra.includes(da.chiave)) m.entra.push(da.chiave);
          if (!da.esce.includes(k)) da.esce.push(k);
          da.vicine.add(k); m.vicine.add(da.chiave);
        }
      }
    });
    for (const p of pagine) p.n = p.vicine.size - p.esce.filter((k) => k.startsWith('mancante:')).length;
    const elencoMancanti = [...mancanti.values()];
    for (const m of elencoMancanti) m.n = m.entra.length;
    // la più collegata, esclusa la pagina INDICE (è la porta, ha sempre più collegamenti di tutte)
    const candidate = pagine.filter((p) => p.id !== 'INDICE');
    const scelte = candidate.length ? candidate : pagine;
    let piuCollegata = scelte[0] ? scelte[0].chiave : null;
    for (const p of scelte) if (p.n > perChiave.get(piuCollegata).n) piuCollegata = p.chiave;
    const tutte = new Map([...perChiave, ...mancanti]);
    return { pagine, mancanti: elencoMancanti, perChiave: tutte, collegamenti: coppie.size, piuCollegata };
  }

  // ---------- la scena: isole, pagine, fili, archi (sempre uguali a parità di dati) ----------
  const R_CERCHIO = 9, R_ANELLO_TU = 7.5, R_STUDIO = 3.4, R_TU = 1.1, R_AREA = 3.0;
  function scena(dati, mem) {
    const aree = dati.workspace;
    const N = aree.length;
    const rArea = Math.min(R_AREA, 0.9 * R_CERCHIO * Math.sin(Math.PI / (N + 1)));
    const isole = [{ id: 'studio', nome: 'Studio', x: 0, z: 0, r: R_STUDIO, tipo: 'studio', colore: 'pagina-studio' }];
    // N+1 posti sul cerchio: il primo, davanti alla camera iniziale (verso +z), è dell'isola Tu
    const posto = (k, rr) => { const a = Math.PI / 2 + (k * 2 * Math.PI) / (N + 1); return [rr * Math.cos(a), rr * Math.sin(a)]; };
    isole.push({ id: 'tu', nome: 'Tu', x: posto(0, R_ANELLO_TU)[0], z: posto(0, R_ANELLO_TU)[1], r: R_TU, tipo: 'tu', colore: null });
    aree.forEach((a, i) => {
      const [x, z] = posto(i + 1, R_CERCHIO);
      isole.push({ id: a.nome, nome: a.titolo, x, z, r: rArea, tipo: 'area', colore: 'area-' + ((i % 4) + 1), area: a.nome });
    });
    const isola = (id) => isole.find((s) => s.id === id) || isole[0];

    // pagine: ogni nodo sta sulla sua isola (studio → isola Studio); le mancanti sulla isola della prima che le cita
    const nodi = [...mem.pagine, ...mem.mancanti].map((p) => {
      const areaId = p.mancante ? mem.perChiave.get(p.entra[0]).area : p.area;
      const isl = isola(areaId === 'studio' ? 'studio' : areaId);
      return { chiave: p.chiave, area: areaId, isola: isl.id, titolo: p.titolo, mancante: p.mancante, n: p.n, x: 0, y: 0, z: 0, r: 0 };
    });
    const nodoPer = new Map(nodi.map((n) => [n.chiave, n]));
    const fili = [];
    const visti = new Set();
    for (const p of [...mem.pagine, ...mem.mancanti]) {
      for (const k of p.esce) {
        const id = [p.chiave, k].sort().join('\u0000');
        if (visti.has(id)) continue;
        visti.add(id);
        const a = nodoPer.get(p.chiave), b = nodoPer.get(k);
        fili.push({ a: a.chiave, b: b.chiave, stessaIsola: a.isola === b.isola, mancante: a.mancante || b.mancante });
      }
    }
    // posizioni: spirale aurea, poi 200 iterazioni di forze (repulsione, molle, richiamo al centro)
    for (const isl of isole) {
      const suoi = nodi.filter((n) => n.isola === isl.id);
      const rMax = 0.85 * isl.r;
      suoi.forEach((n, j) => {
        const ang = j * 2.399963;
        const rad = rMax * 0.7 * Math.sqrt((j + 0.5) / suoi.length);
        n.x = rad * Math.cos(ang); n.z = rad * Math.sin(ang);
      });
      const molle = fili.filter((f) => f.stessaIsola && nodoPer.get(f.a).isola === isl.id);
      for (let it = 0; it < 200; it++) {
        for (let i = 0; i < suoi.length; i++) {
          for (let j = i + 1; j < suoi.length; j++) {
            const a = suoi[i], b = suoi[j];
            let dx = a.x - b.x, dz = a.z - b.z;
            const d2 = dx * dx + dz * dz + 0.01, d = Math.sqrt(d2);
            const f = Math.min(0.6, 1.2 / d2);
            dx /= d; dz /= d;
            a.x += dx * f; a.z += dz * f; b.x -= dx * f; b.z -= dz * f;
          }
        }
        for (const m of molle) {
          const a = nodoPer.get(m.a), b = nodoPer.get(m.b);
          const dx = b.x - a.x, dz = b.z - a.z, d = Math.sqrt(dx * dx + dz * dz) + 0.001;
          const f = 0.05 * (d - 1.2) / d;
          a.x += dx * f; a.z += dz * f; b.x -= dx * f; b.z -= dz * f;
        }
        for (const n of suoi) {
          n.x *= 0.985; n.z *= 0.985;
          const d = Math.sqrt(n.x * n.x + n.z * n.z);
          if (d > rMax) { n.x *= rMax / d; n.z *= rMax / d; }
        }
      }
      for (const n of suoi) { n.x += isl.x; n.z += isl.z; }
    }
    for (const n of nodi) {
      n.y = Math.min(1.1, 0.35 + 0.1 * n.n);
      n.r = n.mancante ? 0.22 : Math.min(0.42, 0.16 + 0.04 * n.n);
    }

    // processi: per ogni grafo un arco che passa per un punto per passo; ogni punto sta sulla sua isola
    const archi = dati.grafi.map((g, gi) => {
      const y = 1.4 + 0.25 * gi;
      let prima = 'studio';
      const ids = g.passi.map((p) => {
        let id;
        if (p.tipo === 'agente') id = p.workspace === 'orchestratore' ? 'studio' : (isole.some((s) => s.id === p.workspace) ? p.workspace : 'studio');
        else if (p.tipo === 'cli') id = 'studio';
        else if (p.tipo === 'umano') id = 'tu';
        else id = prima;
        prima = id;
        return id;
      });
      // direzione di un passo: verso l'isola del passo dopo (se è la stessa, la prima diversa più avanti);
      // per l'ultimo, verso quella del passo prima
      const direzione = (i) => {
        let altro = null;
        for (let k = i + 1; k < ids.length && altro === null; k++) if (ids[k] !== ids[i]) altro = ids[k];
        for (let k = i - 1; k >= 0 && altro === null; k--) if (ids[k] !== ids[i]) altro = ids[k];
        const da = isola(ids[i]), a = altro === null ? null : isola(altro);
        return a ? Math.atan2(a.z - da.z, a.x - da.x) : Math.PI / 2;
      };
      // passi consecutivi sulla stessa isola: distanziati di 0,8 lungo il bordo, centrati sulla direzione
      const punti = [];
      const usati = {};
      let i0 = 0;
      while (i0 < ids.length) {
        let i1 = i0;
        while (i1 + 1 < ids.length && ids[i1 + 1] === ids[i0]) i1++;
        const isl = isola(ids[i0]);
        const rr = 0.6 * isl.r, passo = 0.8 / rr, m = i1 - i0 + 1;
        const base = direzione(i0);
        const lista = (usati[isl.id] = usati[isl.id] || []);
        const dist = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
        const ingombro = ((m - 1) / 2 + 0.9) * passo;
        let centro = base;
        // se l'isola è già stata visitata dallo stesso processo, si scivola oltre i punti già messi
        for (let g2 = 0; g2 < 40 && lista.some((a) => dist(a, centro) < ingombro); g2++) centro += passo * 0.5;
        for (let k = 0; k < m; k++) {
          const a = centro + (k - (m - 1) / 2) * passo;
          lista.push(a);
          punti.push({ x: isl.x + rr * Math.cos(a), y, z: isl.z + rr * Math.sin(a), isola: isl.id, passo: g.passi[i0 + k].id });
        }
        i0 = i1 + 1;
      }
      // la corsa che colora le perline: quella in corso, altrimenti l'ultima
      let corsa = dati.corse.find((c) => c.grafo === g.grafo && c.stato === 'in-corso') || ultimaCorsa(dati, g.grafo);
      const inCorso = !!corsa && corsa.stato === 'in-corso';
      const stati = g.passi.map((p) => { const cp = corsa && corsa.passi.find((x) => x.id === p.id); return cp ? cp.stato : 'da-fare'; });
      const curva = [];
      const PER_TRATTO = 14;
      for (let t = 0; t < punti.length - 1; t++) for (let k = 0; k < PER_TRATTO; k++) curva.push(puntoArcoSu(punti, t + k / PER_TRATTO));
      curva.push(puntoArcoSu(punti, punti.length - 1));
      return { grafo: g.grafo, nome: nomeLeggibile(g.grafo), indice: gi, acceso: g.acceso, punti, curva, stati, inCorso, persa: inCorso && statoCorsa(corsa, dati.ora) === 'persa', corrente: inCorso ? indiceCorrente(corsa) : -1 };
    });
    return { isole, nodi, fili, archi };
  }
  // Il percorso fra i punti: sulla stessa isola un segmento dritto; fra isole diverse una curva quadratica
  // con il controllo al punto medio alzato di 1,5. u = indice del punto, con la parte frazionaria nel tratto.
  function puntoArcoSu(punti, u) {
    const n = punti.length;
    if (n === 1) return { x: punti[0].x, y: punti[0].y, z: punti[0].z };
    const uu = Math.max(0, Math.min(n - 1, u));
    const seg = Math.min(Math.floor(uu), n - 2), t = uu - seg;
    const a = punti[seg], b = punti[seg + 1];
    if (a.isola === b.isola) return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t };
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2 + 1.5, cz = (a.z + b.z) / 2;
    const p = (1 - t) * (1 - t), q = 2 * (1 - t) * t, r = t * t;
    return { x: p * a.x + q * cx + r * b.x, y: p * a.y + q * cy + r * b.y, z: p * a.z + q * cz + r * b.z };
  }

  // ---------- il riepilogo per il supporto: solo nomi, conteggi, l'ultima nota ----------
  function riepilogo(dati, mem, corsaProblemaId) {
    const righe = [];
    righe.push(dati.cartella.nome + ' · ' + dati.cartella.versione + ' · ' + dataLunga(dati.ora));
    righe.push('Obiettivo: ' + dati.periodo.obiettivo);
    righe.push('Aree di lavoro: ' + dati.workspace.map((w) => w.titolo).join(', '));
    const accesi = dati.grafi.filter((g) => g.acceso).length;
    righe.push('Processi: ' + dati.grafi.length + ', ' + accesi + (accesi === 1 ? ' acceso' : ' accesi'));
    const girano = dati.corse.filter((c) => c.stato === 'in-corso');
    righe.push('In corso: ' + (girano.length ? girano.map((c) => nomeLeggibile(c.grafo) + ', passo ' + (indiceCorrente(c) + 1) + ' di ' + c.passi.length).join('; ') : 'niente'));
    const elenco = problemi(dati);
    const scelto = corsaProblemaId ? elenco.find((p) => p.corsaId === corsaProblemaId) : null;
    if (scelto) righe.push(rigaProblema(scelto, 'Problema'));
    else if (elenco.length) righe.push(rigaProblema(elenco[0], 'Ultimo problema'));
    const perTe = dati.periodo.todo.todo.filter((t) => t.chi === 'tu' && t.stato !== 'fatto');
    const oggi = parti(dati.ora).giorno;
    const scadute = perTe.filter((t) => t.scadenza && t.stato !== 'ferma' && t.scadenza < oggi).length;
    righe.push('Tocca a te: ' + plurale(perTe.length, 'cosa', 'cose') + (scadute ? ', ' + plurale(scadute, 'scaduta', 'scadute') : ''));
    righe.push('Memoria: ' + plurale(mem.pagine.length, 'pagina', 'pagine') + ', ' + plurale(mem.collegamenti, 'collegamento', 'collegamenti'));
    righe.push('Cosa mi serve: ');
    return righe.join('\n');
  }

  // ---------- tutta la vista in un colpo ----------
  function vista(dati) {
    const mem = memoria(dati);
    const perTe = dati.periodo.todo.todo.filter((t) => t.chi === 'tu' && t.stato !== 'fatto');
    const oggi = parti(dati.ora).giorno;
    const corse = dati.corse.map((c) => vistaCorsa(dati, c));
    const inCorso = corse.filter((c) => c.stato === 'in-corso' || c.stato === 'persa');
    const ultime = corse.filter((c) => !(c.stato === 'in-corso' || c.stato === 'persa')).sort((a, b) => (dati.corse.find((x) => x.id === a.id).inizio < dati.corse.find((x) => x.id === b.id).inizio ? 1 : -1));
    const aree = dati.workspace.map((w) => ({
      nome: w.nome, titolo: w.titolo, serve: w.serve, percorso: w.percorso,
      pagine: dati.memoria.filter((p) => p.area === w.nome).length,
      cose: dati.periodo.todo.todo.filter((t) => t.stato !== 'fatto' && (t.dove === 'workspace/' + w.nome || t.dove.indexOf('workspace/' + w.nome + '/') === 0)).length,
      processi: processiDellArea(dati, w.nome).map((g) => nomeLeggibile(g.grafo))
    }));
    const processi = dati.grafi.map((g) => {
      const u = ultimaCorsa(dati, g.grafo);
      const e = u ? esitoCorsa(u, dati.ora) : null;
      return {
        id: g.grafo, nome: nomeLeggibile(g.grafo), obiettivo: g.obiettivo, acceso: g.acceso,
        innesco: innescoTesto(g), file: g.file,
        colonne: colonneGrafo(g).map((c) => c.map((i) => ({ nome: nomePasso(g, g.passi[i].id), sotto: sottoPasso(dati, g, i) }))),
        ultima: u ? 'ultima volta: ' + e.testo + ', ' + quando(u.inizio, dati.ora) : ''
      };
    });
    return {
      nomeStudio: dati.cartella.nome,
      aggiornato: 'aggiornato alle ' + oraHM(dati.ora),
      obiettivo: dati.periodo.obiettivo, periodo: dati.periodo.todo.periodo,
      conteggi: {
        perTe: perTe.length, inCorso: dati.corse.filter((c) => c.stato === 'in-corso').length,
        pagine: mem.pagine.length, aree: dati.workspace.length
      },
      gruppi: gruppiTodo(dati), recente: recente(dati),
      inCorso, ultime,
      memoria: mem,
      filtri: [{ chiave: 'tutto', titolo: 'Tutto' }, { chiave: 'studio', titolo: 'Studio' }].concat(dati.workspace.map((w) => ({ chiave: w.nome, titolo: w.titolo }))),
      aree, processi,
      scena: scena(dati, mem),
      tocchiAte: perTe.length > 0,
      riepilogo: (corsaProblemaId) => riepilogo(dati, mem, corsaProblemaId)
    };
  }

  return { vista, puntoArcoSu, nomeLeggibile, quando, scadenza, statoCorsa, avviatoDa, problemi, parti, plurale };
})();

/* ---------- i livelli: a ogni capitolo si accende solo ciò di cui parla ---------- */

const LIVELLI = {

function livelliObiettivo() {

function aggiornaLivelli(subito) {

    if (scelta && !vicinaDiScelta(n.chiave)) alfa *= 1 - 0.5 * acc;
    if (alfa < 0.01) continue;
    const ground = proietta(cam, n.x, 0, n.z);
    const col = n.area === 'studio' ? c['pagina-studio'] : colore(n.isola);
    const sel = !!scelta && n.chiave === scelta.chiave;
    if (ground) fusione(ground.z + 0.01, () => {
      ctx.globalAlpha = alfa * 0.14; ctx.fillStyle = c.testo;
      ctx.beginPath(); ctx.ellipse(ground.x, ground.y, r * 0.9, r * 0.9 * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    });
    fusione(p.z, () => {
      ctx.globalAlpha = alfa;
      if (n.mancante) {
        ctx.strokeStyle = c.secondario; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      } else {
        const g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.35, r * 0.1, p.x, p.y, r);
        g.addColorStop(0, mescola(col, '#ffffff', 0.55)); g.addColorStop(1, mescola(col, '#000000', 0.12));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      }
      if (sel) { ctx.globalAlpha = alfa * acc; ctx.strokeStyle = c.accento; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2); ctx.stroke(); }
    });
    // i nomi: la pagina scelta sempre, le vicine solo se non si sovrappongono a un altro testo
    if (vicinaDiScelta(n.chiave)) etichette.push({ x: p.x, y: p.y - r - 9, r, testo: n.titolo, peso: sel ? '700' : '400', col: c.testo, fondo: true, alfa: acc, sempre: sel, unico: !sel });
  }

  // processi: archi, perline col gambo che le ancora all'isola, luce
  const ora = ts !== undefined ? ts : performance.now();
  for (const arco of sc.archi) {
    const aA = arco.inCorso ? L.arcoInCorso : L.arcoAltri;
    const lucida = arco.inCorso && L.luce > 0.01;
    if (aA < 0.01 && !lucida) continue;
    const evid = arco.inCorso;
    if (aA >= 0.01) {
      const pts = arco.curva.map((q) => proietta(cam, q.x, q.y, q.z));
      for (let k = 0; k < pts.length - 1; k++) {
        const a = pts[k], b = pts[k + 1];
        if (!a || !b) continue;
        const z = (a.z + b.z) / 2;
        fusione(z, () => {
          ctx.globalAlpha = nebbia(z) * aA;
          ctx.strokeStyle = evid ? c.testo : c.secondario;
          ctx.lineWidth = evid ? (cap === 'agenti' ? 2.2 : 1.8) : 1.4;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        });
      }
      arco.punti.forEach((pt, i) => {
        const p = proietta(cam, pt.x, pt.y, pt.z), g = proietta(cam, pt.x, 0, pt.z);
        if (!p) return;
        const r = clamp(0.17 * p.s, 3.5, 8);
        const stato = arco.stati[i];
        const smarrita = arco.persa && i === arco.corrente;
        if (g) fusione(p.z + 0.02, () => {      // il gambo: dalla perlina alla superficie dell'isola
          ctx.globalAlpha = nebbia(p.z) * aA * 0.35;
          ctx.strokeStyle = evid ? c.testo : c.secondario; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(g.x, g.y); ctx.stroke();
          ctx.fillStyle = evid ? c.testo : c.secondario;
          ctx.beginPath(); ctx.ellipse(g.x, g.y, 3, 1.2, 0, 0, Math.PI * 2); ctx.fill();
        });
        fusione(p.z, () => {
          ctx.globalAlpha = nebbia(p.z) * aA;
          ctx.lineWidth = 1.6;
          if (smarrita) {
            ctx.globalAlpha *= muove() ? 0.35 + 0.65 * Math.abs(Math.sin(ora / 330)) : 1;
            ctx.strokeStyle = c.accento; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.arc(p.x, p.y, r + 1, 0, Math.PI * 2); ctx.stroke();
            return;
          }
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          if (stato === 'fatto') { ctx.fillStyle = c.vivo; ctx.fill(); ctx.strokeStyle = c.vivo; ctx.stroke(); }
          else if (stato === 'in-corso') { ctx.fillStyle = c.accento; ctx.fill(); ctx.strokeStyle = c.carta; ctx.stroke(); }
          else if (stato === 'fallito') { ctx.fillStyle = c.ferma; ctx.fill(); ctx.strokeStyle = c.ferma; ctx.stroke(); }
          else { ctx.fillStyle = c.carta; ctx.fill(); ctx.strokeStyle = c.secondario; if (stato === 'saltato') ctx.globalAlpha *= 0.55; ctx.stroke(); }
        });
      });
    }
    // la luce: dall'inizio al passo in corso, in 2,5 secondi; ferma sul passo con il movimento ridotto
    if (lucida && !arco.persa && arco.corrente >= 0) {
      const u = muove() && arco.corrente > 0 ? ((ora % GIRO_LUCE) / GIRO_LUCE) * arco.corrente : arco.corrente;
      const q = LETTURA.puntoArcoSu(arco.punti, u);
      const p = proietta(cam, q.x, q.y, q.z);
      if (p) {
        fusione(p.z - 0.05, () => {
          ctx.globalAlpha = nebbia(p.z) * L.luce;
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 18);
          g.addColorStop(0, conAlfa(c.accento, 0.6)); g.addColorStop(1, conAlfa(c.accento, 0));
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = c.accento; ctx.strokeStyle = c.carta; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        });
        if (L.nomeProc > 0.01) etichette.push({ x: p.x + 12, y: p.y - 14, testo: arco.nome, peso: '700', col: c.testo, fondo: true, alfa: L.nomeProc, lato: 'destra' });
      }
    }
  }

  voci.sort((a, b) => b.z - a.z);
  for (const v of voci) v.f();
  ctx.globalAlpha = 1;
  disegnaEtichette(etichette, font);
}

// i testi della scena, con un fondo carta se occorre; non si sovrappongono (si provano posti vicini)
function disegnaEtichette(lista, font) {
  const ctx = S.ctx, c = S.col;
  const messe = [];
  const urta = (r) => messe.some((q) => r.x < q.x + q.w && r.x + r.w > q.x && r.y < q.y + q.h && r.y + r.h > q.y);
  ctx.textBaseline = 'middle';
  const rango = (e) => (e.fisso ? 0 : e.sempre ? 1 : e.unico ? 3 : 2);
  for (const e of lista.sort((a, b) => rango(a) - rango(b))) {
    if (e.alfa < 0.02) continue;
    ctx.font = font(e.peso);
    const w = ctx.measureText(e.testo).width + 10, h = 20;
    const prova = (e.fisso || e.unico) ? [[0, 0]] : [[0, 0], [0, 2 * (e.r || 6) + 26], [0, -22], [0, 2 * (e.r || 6) + 48], [0, -44], [w / 2 + 14, (e.r || 6) + 12], [-w / 2 - 14, (e.r || 6) + 12]];
    if (e.fisso && (e.x < 0 || e.x > S.W || e.y < 0 || e.y > S.H)) continue; // un nome fuori campo non si tira dentro
    let rc = null, rc0 = null;
    for (const [ox, oy] of prova) {
      const cx = e.lato === 'destra' ? e.x + ox + w / 2 : e.x + ox;
      const x = clamp(cx - w / 2, 2, S.W - w - 2), y = clamp(e.y + oy - h / 2, 2, S.H - h - 2);
      const r = { x, y, w, h };
      if (e.fisso || !urta(r)) { rc = r; break; }
      if (e.sempre && !rc0) rc0 = r;
    }
    if (!rc && e.sempre) rc = rc0;
    if (!rc) continue;
    messe.push(rc);
    ctx.globalAlpha = e.alfa;
    if (e.fondo) {
      ctx.fillStyle = conAlfa(c.carta, 0.92); ctx.strokeStyle = c.linea; ctx.lineWidth = 1;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(rc.x, rc.y, rc.w, rc.h, 5); else ctx.rect(rc.x, rc.y, rc.w, rc.h); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = e.col; ctx.textAlign = 'center';
    ctx.fillText(e.testo, rc.x + rc.w / 2, rc.y + rc.h / 2 + 0.5);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'start';
}

/* ---------- il ciclo: disegna solo se qualcosa cambia ---------- */
function richiediDisegno() { if (!S.raf && !document.hidden) S.raf = requestAnimationFrame(ciclo); }
function serveAnimare() { return !document.hidden && !!(S.trans || S.livTrans || S.trascina || (muove() && S.v)); }
function ciclo(ts) {
  S.raf = 0;
  if (document.hidden) { S.ultimoTs = 0; return; }
  const dt = S.ultimoTs ? Math.min(0.1, (ts - S.ultimoTs) / 1000) : 0;
  S.ultimoTs = ts;
  if (muove() && !S.trascina) S.cam.yaw += GIRO_LENTO * dt;
  if (S.trans) { S.trans.a = obiettivoCamera(); passoCamera(ts); }
  else if (S.v && S.W) { const o = obiettivoCamera(); S.cam.dist = o.dist; S.cam.tx = o.tx; S.cam.ty = o.ty; S.cam.tz = o.tz; }
  if (S.livTrans) passoLivelli(ts);
  disegna(ts);
  if (serveAnimare()) richiediDisegno(); else S.ultimoTs = 0;
}

/* ---------- puntatore: trascinare ruota, un clic sceglie ---------- */
function sceltaSotto(x, y) {
  if (S.capitolo === 'aree') {
    const cam = telecamera(), f = focale();
    const dx = (x - S.W / 2) / f, dy = -(y - S.H / 2) / f;
    const d = [0, 1, 2].map((i) => cam.f[i] + dx * cam.r[i] + dy * cam.u[i]);
    if (d[1] >= -1e-6) return null;
    const t = -cam.py / d[1], px = cam.px + d[0] * t, pz = cam.pz + d[2] * t;
    const isl = S.v.scena.isole.find((i) => i.tipo === 'area' && Math.hypot(i.x - px, i.z - pz) <= i.r);
    return isl ? { isola: isl } : null;
  }
  let meglio = null, md = 1e9;
  for (const n of S.nodiP) {
    const d = Math.hypot(n.x - x, n.y - y);
    if (d <= n.r + 8 && d < md) { md = d; meglio = n; }
  }
  return meglio ? { nodo: meglio } : null;
}
function iniziaPuntatore() {
  const tela = $('tela');
  const pos = (e) => { const r = tela.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  tela.addEventListener('pointerdown', (e) => {
    const [x, y] = pos(e);
    S.trascina = { x0: x, y0: y, x, y, mosso: false, id: e.pointerId };
    S.trans = null;
    try { tela.setPointerCapture(e.pointerId); } catch (err) { /* niente */ }
  });
  tela.addEventListener('pointermove', (e) => {
    const [x, y] = pos(e);
    const t = S.trascina;
    if (!t) { tela.classList.toggle('sopra-pagina', !!sceltaSotto(x, y)); return; }
    if (!t.mosso && Math.hypot(x - t.x0, y - t.y0) > 4) { t.mosso = true; tela.classList.add('afferrata'); }
    if (t.mosso) {
      S.cam.yaw -= (x - t.x) * 0.008;
      S.cam.pitch = clamp(S.cam.pitch + (y - t.y) * 0.006, 0.25, 1.1);
      richiediDisegno();
    }
    t.x = x; t.y = y;
  });
  const fine = (e, annullato) => {
    const t = S.trascina;
    if (!t) return;
    S.trascina = null;
    tela.classList.remove('afferrata');
    try { tela.releasePointerCapture(t.id); } catch (err) { /* niente */ }
    if (!t.mosso && !annullato) {
      const [x, y] = pos(e);
      const s = sceltaSotto(x, y);
      if (s && s.nodo) {
        S.pagina = s.nodo.chiave; S.paginaForzata = true;
        if (S.capitolo === 'memoria') { renderCapitolo('memoria'); richiediDisegno(); } else location.hash = '#memoria';
      } else if (s && s.isola) {
        S.area = s.isola.id; renderCapitolo('aree'); aggiornaCamera(); richiediDisegno();
      }
    }
    richiediDisegno();
  };
  tela.addEventListener('pointerup', (e) => fine(e, false));
  tela.addEventListener('pointercancel', (e) => fine(e, true));
}

/* ---------- misura del canvas ---------- */
function misura() {
  const r = $('scena').getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (w === S.W && h === S.H && dpr === S.dpr) return;
  S.W = w; S.H = h; S.dpr = dpr;
  const tela = $('tela');
  tela.width = Math.round(w * dpr); tela.height = Math.round(h * dpr);
  if (S.v) aggiornaCamera(true);
  richiediDisegno();
}

/* ---------- interruttori: movimento e tema ---------- */
function impostaRidotto(r) {
  S.ridotto = r;
  document.documentElement.setAttribute('data-movimento', r ? 'ridotto' : 'normale');
  $('chk-movimento').checked = r;
  if (r && S.trans) { Object.assign(S.cam, S.trans.a); S.trans = null; }
  if (r && S.livTrans) { S.liv = S.livTrans.a; S.livTrans = null; }
  richiediDisegno();
}
function iniziaInterruttori() {
  const mqRidotto = matchMedia('(prefers-reduced-motion: reduce)');
  impostaRidotto(mqRidotto.matches);
  mqRidotto.addEventListener('change', () => impostaRidotto(mqRidotto.matches));
  $('chk-movimento').addEventListener('change', (e) => impostaRidotto(e.target.checked));

  const mqScuro = matchMedia('(prefers-color-scheme: dark)');
  let salvato = null;
  try { salvato = localStorage.getItem('redacy-tema'); } catch (err) { /* niente */ }
  if (salvato === 'dark' || salvato === 'light') document.documentElement.setAttribute('data-theme', salvato);
  const scuroOra = () => { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : mqScuro.matches; };
  $('chk-tema').checked = scuroOra();
  leggiColori();
  mqScuro.addEventListener('change', () => {
    if (!document.documentElement.getAttribute('data-theme')) { $('chk-tema').checked = mqScuro.matches; leggiColori(); richiediDisegno(); }
  });
  $('chk-tema').addEventListener('change', (e) => {
    const scuro = e.target.checked;
    document.documentElement.setAttribute('data-theme', scuro ? 'dark' : 'light');
    try { localStorage.setItem('redacy-tema', scuro ? 'dark' : 'light'); } catch (err) { /* niente */ }
    leggiColori(); richiediDisegno();
  });
}

/* ---------- tutto si ridisegna da qui: D la richiama con dati nuovi ---------- */
function mostra(dati) {
  S.dati = dati;
  S.v = LETTURA.vista(dati);
  document.title = S.v.nomeStudio + ' · redacy';
  $('nome-studio').textContent = S.v.nomeStudio;
  $('aggiornato').textContent = S.v.aggiornato;
  if (S.pagina && !S.v.memoria.perChiave.has(S.pagina)) S.pagina = S.v.memoria.piuCollegata;
  if (S.area && !S.v.scena.isole.some((i) => i.id === S.area)) S.area = null;
  if (S.capitolo) { aggiornaMenu(); renderCapitolo(S.capitolo); aggiornaCamera(); }
  richiediDisegno();
}

function avvia() {
  costruisciMenu();
  $('btn-supporto').addEventListener('click', () => { location.hash = '#redacy'; });
  const mq = matchMedia('(min-width: 1000px)');
  sistemaPosti();
  mq.addEventListener('change', () => { sistemaPosti(); misura(); });
  S.ctx = $('tela').getContext('2d');
  iniziaInterruttori();
  iniziaPuntatore();
  mostra(DATI);
  misura();
  new ResizeObserver(misura).observe($('scena'));
  window.addEventListener('hashchange', daIndirizzo);
  document.addEventListener('visibilitychange', () => { S.ultimoTs = 0; richiediDisegno(); });
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    const i = CAPITOLI.findIndex((c) => c.id === S.capitolo);
    let j = -1;
    if (/^[0-4]$/.test(e.key)) j = +e.key;
    else if (e.key === 'ArrowRight') j = Math.min(CAPITOLI.length - 1, i + 1);
    else if (e.key === 'ArrowLeft') j = Math.max(0, i - 1);
    if (j >= 0 && j !== i) { e.preventDefault(); location.hash = '#' + CAPITOLI[j].id; }
  });
  daIndirizzo();
  S.pronto = true;
}
(function () {
  let ultimaImpronta = '', ultimoDisegno = 0;
  function impronta(d) {
    return JSON.stringify(d, (k, v) => (k === 'ora' || k === 'minuti_senza_segni') ? undefined : v);
  }
  function segnalaAssenza(attivo) {
    const a = document.getElementById('aggiornato');
    if (a && !attivo) a.textContent = 'il pannello non risponde';
  }
  function aggiorna() {
    if (document.hidden) return;
    caricaDati().then((d) => {
      const imp = impronta(d), adesso = Date.now();
      if (imp !== ultimaImpronta || adesso - ultimoDisegno > 60000) {
        ultimaImpronta = imp; ultimoDisegno = adesso; mostra(d);
      }
    }, () => segnalaAssenza(false));
  }
  caricaDati().then((d) => {
    ultimaImpronta = impronta(d); ultimoDisegno = Date.now();
    avvia();
    setInterval(aggiorna, 4000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) aggiorna(); });
  }, () => {
    document.body.textContent = 'Il pannello non risponde. Riaccendilo dalla chat.';
  });
})();
</script>
