<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pannello</title>
<link rel="stylesheet" href="contenuti.css">
<style>
/* ===== SU MISURA: i valori di partenza. Per ogni utente li cambia interfaccia/su-misura.json (references/su-misura.md), non questo file ===== */
/* Token che si possono cambiare: accento, superfici, raggio. Chiaro, scuro di sistema e scuro scelto. */
:root {
  --m-accento: #1f2733;
  --m-accento-rgb: 31, 39, 51;
  --m-su-accento: #ffffff;
  --m-sup: #ffffff;
  --m-sup-2: #f3f1ec;
  --m-raggio: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --m-accento: #e9ebee;
    --m-accento-rgb: 233, 235, 238;
    --m-su-accento: #16181b;
    --m-sup: #1e2024;
    --m-sup-2: #272a2f;
  }
}
:root[data-theme="dark"] {
  --m-accento: #e9ebee;
  --m-accento-rgb: 233, 235, 238;
  --m-su-accento: #16181b;
  --m-sup: #1e2024;
  --m-sup-2: #272a2f;
}
/* ===== fine SU MISURA ===== */

:root {
  color-scheme: light;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --font: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;

  --fondo: #f5f3ef;
  --lato: #eeebe5;
  --linea: #e0dcd4;
  --linea-forte: #c9c4ba;
  --passa: rgba(31, 39, 51, .06);
  --velo: rgba(22, 22, 24, .44);
  --su-attesa: #ffffff;

  --pc-testo: #1b1d21;
  --pc-testo-2: #50545b;
  --pc-testo-3: #666a71;
  --pc-superficie: var(--m-sup);
  --pc-superficie-2: var(--m-sup-2);
  --pc-linea: var(--linea);
  --pc-accento: var(--m-accento);
  --pc-su-accento: var(--m-su-accento);
  --pc-attesa: #a85a00;
  --pc-corre: #1d6fcc;
  --pc-ok: #17824a;
  --pc-errore: #c33838;
  --pc-raggio: var(--m-raggio);
  --pc-font: var(--font);
  --pc-font-titoli: var(--font);
  --pc-font-mono: var(--mono);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fondo: #141517;
    --lato: #191a1d;
    --linea: #2e3136;
    --linea-forte: #454950;
    --passa: rgba(255, 255, 255, .07);
    --velo: rgba(0, 0, 0, .6);
    --su-attesa: #1d1403;
    --pc-testo: #eceef1;
    --pc-testo-2: #b5b9c0;
    --pc-testo-3: #9095a0;
    --pc-attesa: #f2a93b;
    --pc-corre: #6cb2ff;
    --pc-ok: #4cc58a;
    --pc-errore: #ff7b7b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fondo: #141517;
  --lato: #191a1d;
  --linea: #2e3136;
  --linea-forte: #454950;
  --passa: rgba(255, 255, 255, .07);
  --velo: rgba(0, 0, 0, .6);
  --su-attesa: #1d1403;
  --pc-testo: #eceef1;
  --pc-testo-2: #b5b9c0;
  --pc-testo-3: #9095a0;
  --pc-attesa: #f2a93b;
  --pc-corre: #6cb2ff;
  --pc-ok: #4cc58a;
  --pc-errore: #ff7b7b;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fondo); color: var(--pc-testo); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--m-accento); outline-offset: 2px; }
.salta { position: fixed; left: 12px; top: -60px; z-index: 30; padding: 10px 14px; border-radius: 10px; background: var(--m-accento); color: var(--m-su-accento); font-weight: 650; text-decoration: none; }
.salta:focus { top: 12px; }

/* ---------- la struttura: barra a sinistra, pannello a destra ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.lato { display: flex; flex-direction: column; gap: 22px; min-height: 0; padding: 20px 12px 16px calc(12px + env(safe-area-inset-left, 0px)); background: var(--lato); border-right: 1px solid var(--linea); }
.studio { display: flex; align-items: center; gap: 11px; min-height: 36px; padding: 0 8px; }
.sigla { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--m-accento); color: var(--m-su-accento); font-weight: 700; font-size: 13.5px; letter-spacing: .02em; }
.studio-n { min-width: 0; margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.25; letter-spacing: -.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.voce { position: relative; display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 0 10px; border-radius: 10px; color: var(--pc-testo-2); text-decoration: none; font-weight: 600; font-size: 15px; transition: background-color .15s, color .15s, transform .1s; }
.voce:hover { background: var(--passa); color: var(--pc-testo); }
.voce:active { transform: translateY(1px); }
.voce[aria-current="page"] { background: var(--m-sup); color: var(--pc-testo); box-shadow: 0 0 0 1px var(--linea), 0 1px 2px rgba(20, 20, 20, .06); }
.voce-ic { flex: none; display: grid; }
.voce-ic svg { width: 20px; height: 20px; }
.voce-t { flex: 1; min-width: 0; }
.voce-n { flex: none; display: none; place-items: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; font-size: 12.5px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.voce[data-stato="attenzione"] .voce-n { display: grid; background: var(--pc-attesa); color: var(--su-attesa); }
.voce[data-stato="attenzione"] .voce-n:empty, .voce[data-stato="corre"] .voce-n { display: block; min-width: 0; width: 10px; height: 10px; padding: 0; margin-right: 6px; }
.voce[data-stato="corre"] .voce-n { background: var(--pc-corre); animation: batte 2.6s ease-in-out infinite; }
@keyframes batte { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

.lato-giu { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.vivo { display: flex; align-items: center; gap: 8px; min-height: 20px; margin: 0 0 4px; padding: 0 10px; font-size: 12.5px; color: var(--pc-testo-3); }
.vivo::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--pc-ok); }
.vivo[data-stato="fermo"] { color: var(--pc-testo); }
.vivo[data-stato="fermo"]::before { background: var(--pc-attesa); }
.vivo:empty { display: none; }
.b-lato { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--pc-testo-3) 38%, var(--linea)); background: var(--m-sup); font-weight: 650; font-size: 14px; cursor: pointer; text-align: left; transition: border-color .15s, background-color .15s, transform .1s; }
.b-lato:hover { border-color: var(--pc-testo-2); }
.b-lato:active { transform: translateY(1px); }
.b-lato svg { flex: none; width: 18px; height: 18px; color: var(--pc-testo-2); }
.b-quieto { border-color: transparent; background: transparent; color: var(--pc-testo-2); font-weight: 550; }
.b-quieto:hover { border-color: transparent; background: var(--passa); color: var(--pc-testo); }

main { position: relative; min-width: 0; min-height: 0; background: var(--fondo); outline: 0; }
.pan { position: absolute; inset: 0; }
.pan[hidden] { display: none; }
.pan.entra { animation: entra .26s var(--ease) both; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
body[data-frase="0"] .pc-frase { display: none; }

/* ---------- telefono e tablet in piedi: nome in alto, pannelli in basso ---------- */
@media (max-width: 859px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .lato { flex-direction: row; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) 8px calc(12px + env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--linea); }
  .studio { flex: 1; min-width: 0; padding: 0; }
  .studio-n { -webkit-line-clamp: 1; }
  .lato-giu { margin: 0; flex-direction: row; gap: 6px; }
  .vivo, .largo { display: none; }
  .b-lato { width: auto; min-height: 44px; }
  #tema-b { justify-content: center; width: 44px; padding: 0; }
  #tema-b span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .nav { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; flex-direction: row; gap: 2px; padding: 6px calc(6px + env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) calc(6px + env(safe-area-inset-left, 0px)); background: var(--lato); border-top: 1px solid var(--linea); }
  .voce { flex: 1 1 0; min-width: 0; flex-direction: column; justify-content: center; gap: 3px; min-height: 52px; padding: 6px 2px; font-size: 11.5px; }
  .voce-ic svg { width: 22px; height: 22px; }
  .voce-t { flex: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .voce-n { position: absolute; top: 3px; left: calc(50% + 5px); min-width: 18px; height: 18px; padding: 0 5px; font-size: 11px; box-shadow: 0 0 0 2px var(--lato); }
  .voce[data-stato="attenzione"] .voce-n:empty, .voce[data-stato="corre"] .voce-n { top: 6px; left: calc(50% + 8px); margin: 0; }
  main { margin-bottom: calc(65px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- il foglio del supporto umano ---------- */
#supporto-f { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 20px; background: var(--velo); }
#supporto-f.aperto { display: grid; }
.foglio { position: relative; width: min(540px, 100%); max-height: min(86vh, 720px); overflow: auto; padding: 26px 26px 22px; border-radius: 16px; background: var(--m-sup); border: 1px solid var(--linea); box-shadow: 0 30px 70px -24px rgba(0, 0, 0, .45); animation: entra .26s var(--ease) both; }
.foglio h2 { margin: 0 44px 10px 0; font-size: 21px; line-height: 1.25; letter-spacing: -.01em; outline: 0; }
.foglio h3 { margin: 18px 0 6px; font-size: 13.5px; font-weight: 700; color: var(--pc-testo-2); }
.foglio p { margin: 0 0 6px; color: var(--pc-testo-2); font-size: 15px; }
#sup-pre { margin: 0; max-height: 230px; overflow: auto; padding: 12px 14px; border-radius: 10px; background: var(--m-sup-2); border: 1px solid var(--linea); font: 12.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--pc-testo); }
.foglio .manca { padding: 12px 14px; border: 1px dashed var(--linea-forte); border-radius: 10px; }
.azioni { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.primario, .secondario { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 650; font-size: 15px; text-decoration: none; cursor: pointer; transition: transform .1s, opacity .15s, border-color .15s; }
.primario { background: var(--m-accento); color: var(--m-su-accento); border: 1px solid var(--m-accento); }
.primario:hover { opacity: .9; }
.secondario { background: var(--m-sup); border: 1px solid var(--linea); }
.secondario:hover { border-color: var(--linea-forte); }
.primario:active, .secondario:active { transform: translateY(1px); }
.foglio .x { position: absolute; top: 14px; right: 14px; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--pc-testo-2); cursor: pointer; }
.foglio .x:hover { background: var(--passa); color: var(--pc-testo); }
.foglio .x svg { width: 18px; height: 18px; }
.foglio .esito { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; color: var(--pc-testo); }
@media (max-width: 859px) {
  #supporto-f { place-items: end stretch; padding: 0; }
  .foglio { width: 100%; max-height: 88vh; border-radius: 18px 18px 0 0; border-width: 1px 0 0; padding: 22px 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .azioni > * { flex: 1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .pan.entra, .foglio { animation: none; }
  .voce[data-stato="corre"] .voce-n { animation: none; }
  .voce, .b-lato, .primario, .secondario { transition: none; }
}
</style>

<script>
/* ===== SU MISURA: i valori di partenza. Per ogni utente li cambia interfaccia/su-misura.json (references/su-misura.md), non questo file ===== */
var MISURA = {
  tema: 'auto',         // 'auto' | 'chiaro' | 'scuro': il tema di partenza (la scelta della persona, in localStorage, vince)
  primo: 'oggi',        // il pannello che si apre per primo
  ordine: ['oggi', 'processi', 'periodo', 'memoria', 'aree'],   // l'ordine nella barra
  frase: true,          // la frase in cima a Oggi
  titolo: ''            // il nome in alto a sinistra (se vuoto: il nome della cartella)
};
/* ===== fine SU MISURA ===== */

(window.DATI_PRONTI || Promise.resolve()).then(avvia);

/* le scelte dell'utente (window.REDACY_MISURA): tiene solo le chiavi note e valide, scarta il resto senza errori */
function pulita(m) {
  var o = {};
  if (!m || typeof m !== 'object') return o;
  var ID = (window.Contenuti && Contenuti.pannelli || []).map(function (p) { return p.id; });
  var HEX = /^#[0-9a-fA-F]{6}$/;
  if (m.tema === 'auto' || m.tema === 'chiaro' || m.tema === 'scuro') o.tema = m.tema;
  if (typeof m.primo === 'string' && ID.indexOf(m.primo) >= 0) o.primo = m.primo;
  if (Array.isArray(m.ordine)) {
    var v = []; m.ordine.forEach(function (x) { if (ID.indexOf(x) >= 0 && v.indexOf(x) < 0) v.push(x); });
    ID.forEach(function (x) { if (v.indexOf(x) < 0) v.push(x); });   // i mancanti in coda, nell'ordine standard
    if (m.ordine.length) o.ordine = v;
  }
  if (typeof m.frase === 'boolean') o.frase = m.frase;
  if (m.accento && typeof m.accento === 'object') {
    var a = {};
    if (typeof m.accento.chiaro === 'string' && HEX.test(m.accento.chiaro)) a.chiaro = m.accento.chiaro;
    if (typeof m.accento.scuro === 'string' && HEX.test(m.accento.scuro)) a.scuro = m.accento.scuro;
    if (a.chiaro || a.scuro) o.accento = a;
  }
  if (typeof m.titolo === 'string' && m.titolo.trim()) o.titolo = m.titolo.trim().slice(0, 60);
  return o;
}

/* l'accento scelto: un foglio di stile in più, con le stesse tre porte (chiaro, scuro di sistema, scuro scelto) */
function accentoInStile(a) {
  if (!a) return;
  var rgb = function (h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); };
  var su = function (h) { var c = rgb(h).map(function (v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return (.2126 * c[0] + .7152 * c[1] + .0722 * c[2]) > .4 ? '#16181b' : '#ffffff'; };
  var blocco = function (h) { return '--m-accento:' + h + ';--m-accento-rgb:' + rgb(h).join(', ') + ';--m-su-accento:' + su(h) + ';'; };
  var css = '';
  if (a.chiaro) css += ':root{' + blocco(a.chiaro) + '}';
  if (a.scuro) css += '@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + blocco(a.scuro) + '}}:root[data-theme="dark"]{' + blocco(a.scuro) + '}';
  // se manca uno dei due, l'altro tema usa lo stesso colore
  if (a.chiaro && !a.scuro) css += '@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + blocco(a.chiaro) + '}}:root[data-theme="dark"]{' + blocco(a.chiaro) + '}';
  if (a.scuro && !a.chiaro) css = ':root{' + blocco(a.scuro) + '}' + css;
  var st = document.createElement('style'); st.id = 'accento-scelto'; st.textContent = css; document.head.appendChild(st);
}

function avvia() {
  'use strict';
  MISURA = Object.assign({}, MISURA, pulita(window.REDACY_MISURA));
  accentoInStile(MISURA.accento);
  document.body.dataset.frase = MISURA.frase ? '1' : '0';

  /* ---------- i pannelli, nell'ordine scelto ---------- */
  var P0 = Contenuti.pannelli, byId = {};
  P0.forEach(function (p) { byId[p.id] = p; });
  var IDS = [];
  (MISURA.ordine || []).forEach(function (id) { if (byId[id] && IDS.indexOf(id) < 0) IDS.push(id); });
  P0.forEach(function (p) { if (IDS.indexOf(p.id) < 0) IDS.push(p.id); });
  var PRIMO = byId[MISURA.primo] ? MISURA.primo : IDS[0];
  var dato = function () { return (window.DATI && window.DATI.stato) || {}; };
  var REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)');
  var main = document.getElementById('principale'), nav = document.getElementById('nav');
  var corrente = null, PAN = {}, VOCE = {};

  IDS.forEach(function (id) {
    var p = byId[id];
    var a = document.createElement('a');
    a.className = 'voce'; a.href = '#' + id; a.dataset.id = id;
    a.innerHTML = '<span class="voce-ic">' + p.icona + '</span><span class="voce-t"></span><span class="voce-n" aria-hidden="true"></span><span class="sr"></span>';
    a.querySelector('.voce-t').textContent = p.titolo;
    a.title = p.riga;
    a.addEventListener('click', function (e) {
      if (corrente !== id) return;                 // il cambio di pannello lo fa l'indirizzo
      e.preventDefault();                          // sul pannello già aperto: torna alla sua prima pagina
      var guard = 12; while (guard-- > 0 && PAN[id].ist && PAN[id].ist.indietro()) {}
    });
    nav.appendChild(a); VOCE[id] = a;
    var el = document.createElement('div');
    el.className = 'pan'; el.id = 'pan-' + id; el.hidden = true;
    main.appendChild(el); PAN[id] = { el: el, ist: null };
  });

  /* ---------- il nome dello studio ---------- */
  function nomeStudio() { return MISURA.titolo || (dato().cartella && dato().cartella.nome) || 'Studio'; }
  function sigla(n) {
    var p = String(n).replace(/[^\p{L}\p{N}\s]/gu, ' ').trim().split(/\s+/).filter(Boolean);
    if (!p.length) return '';
    return (p.length === 1 ? p[0].slice(0, 2) : p[0].charAt(0) + p[1].charAt(0)).toUpperCase();
  }
  function titoli() {
    var n = nomeStudio(), el = document.getElementById('s-nome');
    if (el.textContent !== n) { el.textContent = n; document.getElementById('sigla').textContent = sigla(n); }
    var r = null; try { r = Contenuti.riassunto('oggi'); } catch (e) {}
    var k = r ? (r.numero || 0) + (r.guardare || 0) : 0;
    var t = (k ? '(' + k + ') ' : '') + (corrente ? byId[corrente].titolo + ' · ' : '') + n;
    if (document.title !== t) document.title = t;
  }

  /* ---------- da un pannello all'altro ---------- */
  function mostra(id, opt) {
    opt = opt || {};
    if (!PAN[id]) id = PRIMO;
    var prima = corrente, p = PAN[id];
    corrente = id;
    IDS.forEach(function (n) {
      PAN[n].el.hidden = n !== id;
      if (n === id) VOCE[n].setAttribute('aria-current', 'page'); else VOCE[n].removeAttribute('aria-current');
    });
    if (!p.ist) p.ist = Contenuti.monta(id, p.el, 'pieno');
    else if (prima !== id) p.ist.aggiorna();       // era nascosto: si ridisegna alla misura vera
    if (opt.voce) p.ist.vai(opt.voce);
    if (prima && prima !== id && !REDUCE.matches) { p.el.classList.remove('entra'); void p.el.offsetWidth; p.el.classList.add('entra'); }
    try {
      if (location.hash !== '#' + id) { if (opt.spingi) history.pushState(null, '', '#' + id); else history.replaceState(null, '', '#' + id); }
    } catch (e) {}
    titoli();
    if (opt.fuoco) main.focus({ preventScroll: true });
  }
  window.addEventListener('hashchange', function () {
    var h = location.hash.replace('#', '');
    if (h === 'supporto') { apriSupporto(); return; }
    if (h === 'principale') { main.focus({ preventScroll: true }); try { history.replaceState(null, '', '#' + corrente); } catch (e) {} return; }
    if (sheetAperto) chiudiSupporto();
    mostra(PAN[h] ? h : PRIMO);
  });
  main.addEventListener('contenuti:vai', function (e) {
    var d = e.detail || {}; if (!d.pannello || !PAN[d.pannello]) return;
    mostra(d.pannello, { voce: d.voce, spingi: true, fuoco: true });
  });

  /* ---------- tastiera: Esc fa un passo indietro alla volta ---------- */
  function inCampo(t) { return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); }
  window.addEventListener('keydown', function (e) {
    if (sheetAperto) { if (e.key === 'Escape') { e.preventDefault(); chiudiSupporto(); } else if (e.key === 'Tab') trappola(e); return; }
    if (e.key !== 'Escape' || e.defaultPrevented) return;
    if (inCampo(e.target)) { e.target.blur(); return; }
    if (corrente && PAN[corrente].ist && PAN[corrente].ist.indietro()) e.preventDefault();
  });

  /* ---------- il tema: automatico, chiaro, scuro ---------- */
  var TEMI = ['auto', 'chiaro', 'scuro'], NOMI = { auto: 'Tema automatico', chiaro: 'Tema chiaro', scuro: 'Tema scuro' };
  var tema = MISURA.tema;
  try { var ts = localStorage.getItem('redacy-tema'); if (TEMI.indexOf(ts) >= 0) tema = ts; } catch (e) {}
  function mettiTema(t, salva) {
    tema = t;
    var r = document.documentElement;
    if (t === 'chiaro') r.dataset.theme = 'light'; else if (t === 'scuro') r.dataset.theme = 'dark'; else r.removeAttribute('data-theme');
    document.getElementById('tema-t').textContent = NOMI[t];
    document.getElementById('tema-b').setAttribute('aria-label', NOMI[t] + '. Premi per cambiarlo');
    if (salva) { try { localStorage.setItem('redacy-tema', t); } catch (e) {} }
    if (corrente && PAN[corrente].ist) PAN[corrente].ist.aggiorna();   // i disegni rileggono i colori
  }
  document.getElementById('tema-b').addEventListener('click', function () { mettiTema(TEMI[(TEMI.indexOf(tema) + 1) % TEMI.length], true); });

  /* ---------- il foglio del supporto umano ---------- */
  var sheetAperto = false, sheetFuoco = null;
  var fogF = document.getElementById('supporto-f'), fogC = document.getElementById('sup-corpo'), fogLink = document.getElementById('sup-link'), fogEsito = document.getElementById('sup-esito');
  function suppDati() { return dato().supporto || {}; }
  function riempiSupporto() {
    var s = suppDati(), t = typeof s.testo === 'string' ? s.testo : '';
    fogLink.href = s.url || 'https://redacy.com';
    var cur = fogC.firstChild;
    if (t) {
      if (!cur || cur.tagName !== 'PRE') { fogC.replaceChildren(); var pre = document.createElement('pre'); pre.id = 'sup-pre'; pre.tabIndex = 0; pre.setAttribute('aria-label', 'Riepilogo dello studio'); fogC.appendChild(pre); cur = pre; }
      if (cur.textContent !== t) cur.textContent = t;
    } else if (!cur || cur.tagName === 'PRE') {
      fogC.replaceChildren(); var p = document.createElement('p'); p.className = 'manca'; p.textContent = 'Il riepilogo dello studio non è disponibile in questo momento.'; fogC.appendChild(p);
    }
  }
  function apriSupporto() {
    if (sheetAperto) return;
    sheetAperto = true; sheetFuoco = document.activeElement;
    riempiSupporto(); fogEsito.textContent = '';
    fogF.classList.add('aperto'); fogF.setAttribute('aria-hidden', 'false');
    setTimeout(function () { document.getElementById('sup-t').focus({ preventScroll: true }); }, 30);
  }
  function chiudiSupporto() {
    if (!sheetAperto) return;
    sheetAperto = false; fogF.classList.remove('aperto'); fogF.setAttribute('aria-hidden', 'true');
    if (location.hash === '#supporto') { try { history.replaceState(null, '', '#' + (corrente || PRIMO)); } catch (e) {} }
    var f = sheetFuoco; sheetFuoco = null;
    if (f && f.focus && document.contains(f)) f.focus({ preventScroll: true });
  }
  function trappola(e) {
    var els = Array.prototype.filter.call(fogF.querySelectorAll('button, a[href], pre[tabindex]'), function (x) { return x.offsetParent !== null; });
    if (!els.length) return;
    var a = document.activeElement, i = els.indexOf(a);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); els[els.length - 1].focus(); }
    else if (!e.shiftKey && (i === els.length - 1)) { e.preventDefault(); els[0].focus(); }
    else if (i < 0) { e.preventDefault(); els[0].focus(); }
  }
  function selezionaRiepilogo() {
    var pre = document.getElementById('sup-pre'); if (!pre) return;
    try { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  }
  function copiaRiepilogo(t) {
    var ok = function () { fogEsito.textContent = 'Riepilogo copiato. Incollalo nella richiesta su redacy.com.'; };
    var no = function () { fogEsito.textContent = 'Seleziona il riepilogo e copialo.'; };
    var vecchio = function () { selezionaRiepilogo(); var r = false; try { r = document.execCommand('copy'); } catch (e) {} if (r) ok(); else no(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, vecchio);
      else vecchio();
    } catch (e) { vecchio(); }
  }
  fogLink.addEventListener('click', function () {      // non ferma il link: copia e lascia andare
    var t = suppDati().testo;
    if (typeof t === 'string' && t) copiaRiepilogo(t); else fogEsito.textContent = 'Non c’è un riepilogo da copiare: racconta tu cosa serve nella richiesta.';
  });
  document.getElementById('sup-x').addEventListener('click', chiudiSupporto);
  document.getElementById('sup-chiudi').addEventListener('click', chiudiSupporto);
  fogF.addEventListener('click', function (e) { if (e.target === fogF) chiudiSupporto(); });
  document.getElementById('supp-b').addEventListener('click', apriSupporto);

  /* ---------- i segni vivi: i pallini nella barra, il titolo della scheda, l'ora dell'ultimo dato ---------- */
  var fOra = (function () { try { return new Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); } catch (e) { return new Intl.DateTimeFormat('it-IT', { hour: '2-digit', minute: '2-digit' }); } })();
  function stati() {
    IDS.forEach(function (n) {
      var r = null; try { r = Contenuti.riassunto(n); } catch (e) {}
      var st = (r && r.stato) || 'calmo', a = VOCE[n];
      if (n !== 'oggi' && st === 'attenzione') st = r.corre ? 'corre' : 'calmo';        // ciò che chiede attenzione sta già in Oggi
      var tot = n === 'oggi' && r ? (r.numero || 0) + (r.guardare || 0) : 0;
      var num = tot ? String(tot) : '';
      if (a.dataset.stato !== st) a.dataset.stato = st;
      var b = a.querySelector('.voce-n'); if (b.textContent !== num) b.textContent = num;
      var tx = '';
      if (r && st === 'attenzione') tx = ', ' + (r.numero ? r.numero + ' ' + (r.etichetta || '') : '') + (r.numero && r.guardare ? ', ' : '') + (r.guardare ? r.guardare + ' da guardare' : '');
      else if (r && st === 'corre') tx = ', sta lavorando';
      var sr = a.querySelector('.sr'); if (sr.textContent !== tx) sr.textContent = tx;
    });
  }
  function vivo() {
    var el = document.getElementById('vivo'), o = dato().ora; if (!o) { if (el.textContent) el.textContent = ''; return; }
    var d = new Date(o), fermo = !!window.REDACY_PANNELLO && (Date.now() - d.getTime()) > 25000;
    var t = (fermo ? 'Non aggiornato dalle ' : 'Aggiornato alle ') + fOra.format(d);
    if (el.textContent !== t) el.textContent = t;
    var s = fermo ? 'fermo' : 'vivo'; if (el.dataset.stato !== s) el.dataset.stato = s;
  }
  function aggiornaTutto() { titoli(); stati(); vivo(); if (sheetAperto) riempiSupporto(); }
  document.addEventListener('contenuti:dati', aggiornaTutto);
  setInterval(aggiornaTutto, 1500);      // il contenuto aggiorna da sé le sue istanze: qui si legge solo il risultato

  /* ---------- avvio ---------- */
  mettiTema(tema, false);
  var h0 = location.hash.replace('#', '');
  mostra(PAN[h0] ? h0 : PRIMO);
  aggiornaTutto();
  if (h0 === 'supporto') apriSupporto();
}
</script>
</body>
</html>
