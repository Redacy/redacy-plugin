<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pannello</title>
<link rel="stylesheet" href="contenuti.css">
<style>
/* ===== SU MISURA: i valori di partenza. Per ogni utente li cambia interfaccia/su-misura.json (references/su-misura.md), non questo file ===== */
/* Token che si possono cambiare: accento, superfici, raggio. Chiaro, scuro di sistema e scuro scelto. */
:root {
  --m-accento: #5148d8;
  --m-accento-rgb: 81, 72, 216;
  --m-su-accento: #ffffff;
  --m-sup: #ffffff;
  --m-sup-2: #f3f4f8;
  --m-raggio: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --m-accento: #8f8cff;
    --m-accento-rgb: 143, 140, 255;
    --m-su-accento: #14122e;
    --m-sup: #1b1e2a;
    --m-sup-2: #232738;
  }
}
:root[data-theme="dark"] {
  --m-accento: #8f8cff;
  --m-accento-rgb: 143, 140, 255;
  --m-su-accento: #14122e;
  --m-sup: #1b1e2a;
  --m-sup-2: #232738;
}
/* ===== fine SU MISURA ===== */

:root {
  color-scheme: light;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --dur: .52s;
  --dur-op: .3s;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --barra-h: 38px;
  --perc-h: 36px;

  --base: #dfe4ee;
  --sup: var(--m-sup);
  --sup-2: var(--m-sup-2);
  --bordo: #c3c8d4;
  --bordo-barra: #cdd1db;
  --barra-1: #f7f8fb;
  --barra-2: #e5e8ef;
  --ombra: 0 22px 44px -18px rgba(24, 30, 60, .45), 0 3px 8px rgba(24, 30, 60, .16);
  --ombra-aperta: 0 34px 70px -22px rgba(24, 30, 60, .55), 0 4px 12px rgba(24, 30, 60, .18);
  --glow: 0 0 0 1px rgba(var(--m-accento-rgb), .22), 0 0 30px rgba(var(--m-accento-rgb), .13);
  --glow-casa: 0 0 0 1px rgba(var(--m-accento-rgb), .16), 0 0 24px rgba(var(--m-accento-rgb), .09);
  --casa-t: #1b2036;
  --casa-t2: #4a5270;
  --chip: #ffffff;
  --vetro: rgba(255, 255, 255, .74);
  --chip-t: #2a3050;
  --chip-bordo: #c9cedb;
  --tinta: #e4e7ee;
  --ring: var(--m-accento);

  --pc-testo: #1c1e26;
  --pc-testo-2: #4b5060;
  --pc-testo-3: #6b7080;
  --pc-superficie: var(--m-sup-2);
  --pc-superficie-2: #e9ebf1;
  --pc-linea: #dcdfe7;
  --pc-accento: var(--m-accento);
  --pc-su-accento: var(--m-su-accento);
  --pc-attesa: #a85a00;
  --pc-corre: #1d6fcc;
  --pc-ok: #17824a;
  --pc-errore: #c33838;
  --pc-raggio: calc(var(--m-raggio) * .72);
  --pc-font: var(--font);
  --pc-font-titoli: var(--font);
  --pc-font-mono: var(--mono);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --base: #06080f;
    --bordo: #3a4058;
    --bordo-barra: #333950;
    --barra-1: #2c3144;
    --barra-2: #232738;
    --ombra: 0 24px 48px -16px rgba(0, 0, 0, .8), 0 3px 8px rgba(0, 0, 0, .45);
    --ombra-aperta: 0 40px 80px -20px rgba(0, 0, 0, .85), 0 4px 12px rgba(0, 0, 0, .5);
    --glow: 0 0 0 1px rgba(var(--m-accento-rgb), .28), 0 0 34px rgba(var(--m-accento-rgb), .16);
    --glow-casa: 0 0 0 1px rgba(var(--m-accento-rgb), .2), 0 0 26px rgba(var(--m-accento-rgb), .11);
    --casa-t: #f1f3fb;
    --casa-t2: #aeb5cf;
    --chip: #1d2133;
    --vetro: rgba(29, 33, 51, .72);
    --chip-t: #d8dcee;
    --chip-bordo: #3a4058;
    --tinta: #0f1117;
    --pc-testo: #eceef6;
    --pc-testo-2: #b4b9cc;
    --pc-testo-3: #8d93a8;
    --pc-superficie-2: #2e3345;
    --pc-linea: #363b4f;
    --pc-attesa: #f2a93b;
    --pc-corre: #6cb2ff;
    --pc-ok: #4cc58a;
    --pc-errore: #ff7b7b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --base: #06080f;
  --bordo: #3a4058;
  --bordo-barra: #333950;
  --barra-1: #2c3144;
  --barra-2: #232738;
  --ombra: 0 24px 48px -16px rgba(0, 0, 0, .8), 0 3px 8px rgba(0, 0, 0, .45);
  --ombra-aperta: 0 40px 80px -20px rgba(0, 0, 0, .85), 0 4px 12px rgba(0, 0, 0, .5);
  --glow: 0 0 0 1px rgba(var(--m-accento-rgb), .28), 0 0 34px rgba(var(--m-accento-rgb), .16);
  --glow-casa: 0 0 0 1px rgba(var(--m-accento-rgb), .2), 0 0 26px rgba(var(--m-accento-rgb), .11);
  --casa-t: #f1f3fb;
  --casa-t2: #aeb5cf;
  --chip: #1d2133;
  --vetro: rgba(29, 33, 51, .72);
  --chip-t: #d8dcee;
  --chip-bordo: #3a4058;
  --tinta: #0f1117;
  --pc-testo: #eceef6;
  --pc-testo-2: #b4b9cc;
  --pc-testo-3: #8d93a8;
  --pc-superficie-2: #2e3345;
  --pc-linea: #363b4f;
  --pc-attesa: #f2a93b;
  --pc-corre: #6cb2ff;
  --pc-ok: #4cc58a;
  --pc-errore: #ff7b7b;
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur: .01s; --dur-op: .2s; }
}
@media (max-width: 699px) {
  :root { --barra-h: 46px; --perc-h: 40px; }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--base);
  color: var(--casa-t);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
body.istante *, body.istante *::before, body.istante *::after { transition: none !important; animation-duration: 0s !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; }

/* ---------- lo spazio dietro ---------- */
#dietro {
  position: fixed; inset: -9%; z-index: 0; overflow: hidden;
  transform-origin: 50% 50%;
  transition: transform var(--dur) var(--ease), filter var(--dur) var(--ease);
  background: var(--tinta);
}
body.aperto #dietro { transform: scale(.92); filter: blur(7px) brightness(.62) saturate(.9); }
:root:not([data-theme="dark"]) body.aperto #dietro { filter: blur(7px) brightness(.88) saturate(1.05); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.aperto #dietro { filter: blur(7px) brightness(.62) saturate(.9); } }
:root[data-theme="dark"] body.aperto #dietro { filter: blur(7px) brightness(.62) saturate(.9); }
#gal { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
body[data-sfondo="galassia"] #gal { display: block; }
#scriv { position: absolute; inset: 0; display: none; overflow: hidden;
  background: linear-gradient(160deg, #dfe3ec, #ece7ef 55%, #e3e9f2); }
body[data-sfondo="scrivania"] #scriv { display: block; }
#scriv i { position: absolute; border-radius: 50%; filter: blur(90px); }
#scriv i:nth-child(1) { width: 46%; height: 52%; left: 8%; top: 6%; background: rgba(120, 160, 255, .5); }
#scriv i:nth-child(2) { width: 40%; height: 46%; right: 4%; top: 30%; background: rgba(255, 168, 188, .4); }
#scriv i:nth-child(3) { width: 38%; height: 40%; left: 30%; bottom: -6%; background: rgba(150, 228, 208, .38); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #scriv { background: linear-gradient(160deg, #12141b, #181a25 55%, #11141c); }
  :root:not([data-theme="light"]) #scriv i:nth-child(1) { background: rgba(70, 92, 210, .34); }
  :root:not([data-theme="light"]) #scriv i:nth-child(2) { background: rgba(150, 70, 150, .24); }
  :root:not([data-theme="light"]) #scriv i:nth-child(3) { background: rgba(40, 140, 140, .22); }
}
:root[data-theme="dark"] #scriv { background: linear-gradient(160deg, #12141b, #181a25 55%, #11141c); }
:root[data-theme="dark"] #scriv i:nth-child(1) { background: rgba(70, 92, 210, .34); }
:root[data-theme="dark"] #scriv i:nth-child(2) { background: rgba(150, 70, 150, .24); }
:root[data-theme="dark"] #scriv i:nth-child(3) { background: rgba(40, 140, 140, .22); }

#fondo-clic { position: fixed; inset: 0; z-index: 1; border: 0; background: transparent; padding: 0; display: none; cursor: zoom-out; }
body.aperto #fondo-clic { display: block; }

/* ---------- barra in alto ---------- */
.alto { position: fixed; z-index: 60; left: 0; right: 0; top: 0; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px;
  transition: opacity .35s ease, visibility 0s; }
.alto > * { pointer-events: auto; }
.alto .rompi { display: none; }
body.vicino .alto { opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s .35s; }
body.vicino .alto > * { pointer-events: none; }
.meta, .sel, .supp { min-height: 32px; display: flex; align-items: center; font-size: 12px; background: var(--chip); border: 1px solid var(--chip-bordo); border-radius: 9px; color: var(--chip-t); }
.meta { gap: 4px; padding: 3px; margin-right: auto; }
.meta a, .meta span { padding: 4px 8px; border-radius: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
.meta a:hover { background: var(--sup-2); }
.meta span { font-weight: 600; background: var(--sup-2); }
.nome-studio { margin-right: auto; align-self: center; font-size: 13px; font-weight: 600; letter-spacing: .01em; color: var(--casa-t2); max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 2px; }
.sel { gap: 2px; padding: 3px; }
.sel-t { padding: 0 6px 0 8px; opacity: .7; }
.sel button { border: 0; background: transparent; border-radius: 6px; padding: 4px 9px; cursor: pointer; color: inherit; }
.sel button:hover { background: var(--sup-2); }
.sel button[aria-pressed="true"] { background: var(--pc-accento); color: var(--pc-su-accento); font-weight: 600; }
.supp { gap: 6px; padding: 0 12px; cursor: pointer; }
.supp:hover { background: var(--sup-2); }
.supp svg { width: 15px; height: 15px; flex: none; }

/* ---------- saluto della casa ---------- */
#saluto { position: fixed; z-index: 3; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 60px); text-align: center; padding: 0 16px;
  transition: opacity calc(var(--dur) * .6) var(--ease), transform var(--dur) var(--ease); pointer-events: none; }
#saluto[hidden] { display: none; }
body.aperto #saluto { opacity: 0; transform: scale(.94); }
#saluto .nome { font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--casa-t2); font-weight: 600; }
#saluto h1 { margin: 6px 0 4px; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; color: var(--casa-t); }
#saluto p { margin: 0; font-size: 16px; color: var(--casa-t2); display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
#saluto .tardi { background: var(--pc-attesa); color: #fff; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 9px; }
:root[data-theme="dark"] #saluto .tardi { color: #20140a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #saluto .tardi { color: #20140a; } }

/* ---------- le finestre-cartella ---------- */
#spazio { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
#spazio > * { pointer-events: auto; }
.fin { position: absolute; left: 0; top: 0; width: 300px; height: 200px; z-index: 2;
  transition: left var(--dur) var(--ease), top var(--dur) var(--ease), width var(--dur) var(--ease), height var(--dur) var(--ease),
              translate var(--dur) var(--ease), scale .28s var(--ease), opacity .22s ease-out; }
/* chiusa nel dock: rimpicciolisce fino al suo nome e solo alla fine sparisce */
#spazio > .fin[data-pos="dock"] { opacity: 0; pointer-events: none;
  transition: left var(--dur) var(--ease), top var(--dur) var(--ease), width var(--dur) var(--ease), height var(--dur) var(--ease),
              translate var(--dur) var(--ease), scale .28s var(--ease), opacity calc(var(--dur) * .9) cubic-bezier(.55, 0, .9, .6); }
.fin[data-z="5"] { z-index: 5; } .fin[data-z="6"] { z-index: 6; }
.fin.galleggia { animation: flota var(--fl, 13s) ease-in-out var(--ritardo, 0s) infinite; }
@keyframes flota { 0%, 100% { translate: 0 0; } 25% { translate: 0 -4px; } 75% { translate: 0 4px; } }
.fin[data-pos="casa"]:hover { scale: 1.025; }
.fin.dissolvi { animation: dissolvi .24s ease-out both; }
@keyframes dissolvi { from { opacity: 0; } to { opacity: 1; } }

.sup { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--sup);
  border: 1px solid var(--bordo); border-radius: var(--m-raggio); box-shadow: var(--ombra);
  transition: border-radius var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color .25s; }
.fin[data-pos="dock"] .sup { border-radius: 8px; }
.fin[data-pos="casa"] .sup { box-shadow: var(--ombra), var(--glow-casa); }
.fin[data-pos="aperto"] .sup { border-radius: calc(var(--m-raggio) * .85); box-shadow: var(--ombra-aperta), var(--glow); }
body.vicino .fin[data-pos="aperto"] .sup { border-radius: calc(var(--m-raggio) * .7); }
.fin[data-pos="casa"]:hover .sup { border-color: var(--pc-accento); }
.fin:has(.apri:focus-visible) .sup { outline: 3px solid var(--ring); outline-offset: 3px; }
.fin.grande[data-pos="casa"] .sup { box-shadow: var(--ombra), var(--glow); }
/* il bagliore dice come sta: ambra = tocca a te, blu = sta lavorando */
.fin[data-pos="casa"][data-stato="attenzione"] .sup { box-shadow: var(--ombra), 0 0 0 1px color-mix(in srgb, var(--pc-attesa) 55%, transparent), 0 0 30px color-mix(in srgb, var(--pc-attesa) 28%, transparent); }
.fin[data-pos="casa"][data-stato="corre"] .sup { box-shadow: var(--ombra), 0 0 0 1px color-mix(in srgb, var(--pc-corre) 55%, transparent), 0 0 30px color-mix(in srgb, var(--pc-corre) 26%, transparent); }

.barra { flex: none; height: 0; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 8px 0 14px;
  background: linear-gradient(var(--barra-1), var(--barra-2)); border-bottom: 0 solid var(--bordo-barra);
  transition: height var(--dur) var(--ease); }
.fin[data-pos="aperto"] .barra { height: var(--barra-h); border-bottom-width: 1px; }
.tit { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--pc-testo); white-space: nowrap; min-width: 0; }
.tit svg { width: 18px; height: 18px; color: var(--pc-accento); flex: none; }
.vic { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--bordo);
  background: var(--sup); color: var(--pc-testo-2); font-size: 13px; cursor: pointer; }
.vic:hover { color: var(--pc-testo); border-color: var(--pc-accento); }
.vic svg { width: 15px; height: 15px; flex: none; }

.percorso { flex: none; height: 0; overflow: hidden; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: var(--sup-2); border-bottom: 0 solid var(--bordo-barra); transition: height var(--dur) var(--ease); }
.fin[data-pos="aperto"] .percorso { height: var(--perc-h); border-bottom-width: 1px; }
.indietro { flex: none; width: 28px; height: 28px; border: 1px solid var(--bordo); border-radius: 7px; background: var(--sup); display: grid; place-items: center; cursor: pointer; color: var(--pc-testo-2); padding: 0; }
.indietro:hover { color: var(--pc-testo); border-color: var(--pc-accento); }
.indietro svg { width: 15px; height: 15px; }
.briciole { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; min-width: 0; font-size: 13px; color: var(--pc-testo-3); white-space: nowrap; }
.briciole li { display: flex; align-items: center; min-width: 0; }
.briciole li + li::before { content: "\203A"; margin: 0 6px; color: var(--pc-testo-3); font-size: 15px; }
.briciole button { border: 0; background: transparent; cursor: pointer; padding: 3px 6px; border-radius: 6px; color: var(--pc-testo-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.briciole button:hover { background: var(--pc-superficie-2); color: var(--pc-testo); }
.briciole li:last-child { min-width: 0; flex: 0 1 auto; }
.briciole li:last-child span { color: var(--pc-testo); font-weight: 600; padding: 3px 6px; overflow: hidden; text-overflow: ellipsis; }

.corpo { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; background: var(--sup); outline: none; color: var(--pc-testo); }
.el { position: absolute; transform-origin: 0 0; }
.el.ant { left: 0; top: 0; transition: transform var(--dur) var(--ease); }
.el.pt { transition: none; }
.el.pieno { left: 0; top: 0; width: 100%; height: 100%; }
.vela { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--sup); pointer-events: none; display: none; z-index: 3; overflow: hidden;
  transition: transform var(--dur) var(--ease), opacity var(--dur-op) ease-out; }

.et { position: absolute; left: -24px; right: -24px; top: calc(100% + 9px); text-align: center; pointer-events: none; color: var(--casa-t);
  transition: opacity calc(var(--dur) * .5) var(--ease); }
.et b { display: block; font-size: 15px; font-weight: 650; letter-spacing: -.005em; }
.et small { display: block; font-size: 12.5px; color: var(--casa-t2); margin-top: 1px; }
.fin:not([data-pos="casa"]) .et { opacity: 0; }
.apri { position: absolute; left: 0; right: 0; top: 0; bottom: -30px; z-index: 4; border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: var(--m-raggio); }
.apri:focus-visible { outline: none; }
.fin:not([data-pos="casa"]) .apri { display: none; }
.badge { position: absolute; z-index: 5; top: -10px; right: -10px; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 99px; background: var(--pc-attesa); color: #fff;
  font-weight: 700; font-size: 14px; display: grid; place-items: center; border: 2px solid var(--base); pointer-events: none;
  transition: opacity calc(var(--dur) * .5) var(--ease), transform var(--dur) var(--ease); }
:root[data-theme="dark"] .badge { color: #20140a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { color: #20140a; } }
.fin:not([data-pos="casa"]) .badge { opacity: 0; transform: scale(.4); }

/* ---------- il dock: i nomi dei pannelli, con il puntino che scorre ---------- */
.dockbar { position: fixed; z-index: 50; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; justify-content: center; pointer-events: none;
  padding: 0 max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); transition: opacity .35s ease, visibility 0s; }
body.vicino .dockbar { opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s .35s; }
.dock { pointer-events: auto; padding: 6px; border-radius: 24px; background: var(--vetro); border: 1px solid var(--chip-bordo);
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  box-shadow: var(--ombra), inset 0 1px 0 rgba(255, 255, 255, .28); }
body.vicino .dock { pointer-events: none; }
.dock-in { position: relative; display: flex; align-items: stretch; gap: 2px; }
.d-b { position: relative; display: flex; align-items: center; gap: 9px; min-height: 52px; padding: 6px 18px 15px; border: 0; background: transparent; border-radius: 18px;
  font-size: 15.5px; font-weight: 590; color: var(--casa-t2); cursor: pointer; white-space: nowrap; transition: color .25s, background .2s; }
.d-b:hover { color: var(--casa-t); background: rgba(var(--m-accento-rgb), .09); }
.d-b[aria-current="page"] { color: var(--casa-t); }
.d-ico { position: relative; display: grid; place-items: center; width: 22px; height: 22px; flex: none; }
.d-ico svg { width: 22px; height: 22px; }

  var sheetAperto = false, sheetFuoco = null;
  var fogF = document.getElementById('supporto-f'), fogC = document.getElementById('sup-corpo'), fogLink = document.getElementById('sup-link'), fogEsito = document.getElementById('sup-esito');
  function suppDati() { return dato().supporto || {}; }
  function riempiSupporto() {
    var s = suppDati(), t = typeof s.testo === 'string' ? s.testo : '';
    fogLink.href = s.url || 'https://redacy.com';
    var cur = fogC.firstChild;
    if (t) {
      if (!cur || cur.tagName !== 'PRE') { fogC.replaceChildren(); var pre = document.createElement('pre'); pre.id = 'sup-pre'; pre.tabIndex = 0; pre.setAttribute('aria-label', 'Riepilogo dello studio'); fogC.appendChild(pre); cur = pre; }
      if (cur.textContent !== t) cur.textContent = t;
    } else if (!cur || cur.tagName === 'PRE') {
      fogC.replaceChildren(); var p = document.createElement('p'); p.className = 'manca'; p.textContent = 'Il riepilogo dello studio non è disponibile in questo momento.'; fogC.appendChild(p);
    }
  }
  function apriSupporto() {
    if (sheetAperto) return;
    sheetAperto = true; sheetFuoco = document.activeElement;
    riempiSupporto(); fogEsito.textContent = '';
    fogF.classList.add('aperto'); fogF.setAttribute('aria-hidden', 'false');
    setTimeout(function () { document.getElementById('sup-t').focus({ preventScroll: true }); }, 30);
  }
  function chiudiSupporto() {
    if (!sheetAperto) return;
    sheetAperto = false; fogF.classList.remove('aperto'); fogF.setAttribute('aria-hidden', 'true');
    if (location.hash === '#supporto') setHash(aperto);
    var f = sheetFuoco; sheetFuoco = null;
    if (f && f.focus && document.contains(f)) f.focus({ preventScroll: true });
  }
  function trappola(e) {
    var els = Array.prototype.filter.call(fogF.querySelectorAll('button, a[href], pre[tabindex]'), function (x) { return x.offsetParent !== null; });
    if (!els.length) return;
    var a = document.activeElement, i = els.indexOf(a);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); els[els.length - 1].focus(); }
    else if (!e.shiftKey && (i === els.length - 1)) { e.preventDefault(); els[0].focus(); }
    else if (i < 0) { e.preventDefault(); els[0].focus(); }
  }
  function selezionaRiepilogo() {
    var pre = document.getElementById('sup-pre'); if (!pre) return;
    try { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  }
  function copiaRiepilogo(t) {
    var ok = function () { fogEsito.textContent = 'Riepilogo copiato. Incollalo nella richiesta su redacy.com.'; };
    var no = function () { fogEsito.textContent = 'Seleziona il riepilogo e copialo.'; };
    var vecchio = function () { selezionaRiepilogo(); var r = false; try { r = document.execCommand('copy'); } catch (e) {} if (r) ok(); else no(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, vecchio);
      else vecchio();
    } catch (e) { vecchio(); }
  }
  fogLink.addEventListener('click', function () {      // non ferma il link: copia e lascia andare
    var t = suppDati().testo;
    if (typeof t === 'string' && t) copiaRiepilogo(t); else fogEsito.textContent = 'Non c’è un riepilogo da copiare: racconta tu cosa serve nella richiesta.';
  });
  document.getElementById('sup-x').addEventListener('click', chiudiSupporto);
  document.getElementById('sup-chiudi').addEventListener('click', chiudiSupporto);
  fogF.addEventListener('click', function (e) { if (e.target === fogF) chiudiSupporto(); });
  document.getElementById('supp-b').addEventListener('click', apriSupporto);

  /* ---------- la casa: la prova dei cinque secondi, e i numeri vivi ---------- */
  function saluto() {
    var S = dato(), c = S.conta || {}, n = c.per_te || 0, lavora = c.in_corso || 0;
    titoloStudio();
    if (!MISURA.frase) { document.getElementById('saluto').hidden = true; var b0 = document.querySelector('.badge'); if (b0) b0.textContent = n; return; }
    document.getElementById('saluto').hidden = false;
    try { var r = Contenuti.riassunto('oggi'); if (r && typeof r.numero === 'number') n = r.numero; } catch (e) {}
    var tardi = ((S.periodo && S.periodo.aspettano_te) || []).filter(function (x) { return x.in_ritardo; }).length;
    var nm = (S.cartella && S.cartella.nome) || '';
    var elN = document.getElementById('s-nome'); if (elN.textContent !== nm) elN.textContent = nm;
    var tt = n === 0 ? 'Niente aspetta te' : n + (n === 1 ? ' cosa per te' : ' cose per te'), elT = document.getElementById('s-t');
    if (elT.textContent !== tt) elT.textContent = tt;
    var p = document.getElementById('s-p');
    var a = lavora === 0 ? 'Niente sta lavorando adesso' : (lavora === 1 ? '1 sta lavorando' : lavora + ' stanno lavorando');
    try { var rr2 = Contenuti.riassunto('oggi'); if (rr2 && rr2.righe) a = rr2.righe.filter(function (x) { return !/in ritardo/.test(x); }).join(' · ') || a; } catch (e) {}
    if (p.dataset.t !== a + tardi) {
      p.dataset.t = a + tardi;
      p.textContent = a;
      if (tardi) { var sp = document.createElement('span'); sp.className = 'tardi'; sp.textContent = tardi === 1 ? '1 in ritardo' : tardi + ' in ritardo'; p.appendChild(sp); }
    }
    var b = document.querySelector('.badge'); if (b && b.textContent !== String(n)) b.textContent = n;
  }
  /* i bagliori delle piastrelle e gli stati nel dock */
  function aggiornaStati() {
    IDS.forEach(function (n) {
      var r = null; try { r = Contenuti.riassunto(n); } catch (e) {}
      var st = (r && r.stato) || 'calmo', f = F[n], b = DB[n];
      if (f.fin.dataset.stato !== st) f.fin.dataset.stato = st;
      if (b.dataset.stato !== st) b.dataset.stato = st;
      var tx = r && typeof r.numero === 'number' ? ', ' + r.numero + ' ' + (r.etichetta || '') : '';
      var sr = b.querySelector('.sr'); if (sr.textContent !== tx) sr.textContent = tx;
    });
  }
  function aggiornaTutto() { saluto(); aggiornaStati(); if (sheetAperto) riempiSupporto(); }
  document.addEventListener('contenuti:dati', aggiornaTutto);
  aggiornaTutto();
  setInterval(aggiornaTutto, 1500);      // il contenuto aggiorna da sé le sue istanze: qui si legge solo il risultato

  /* ---------- avvio ---------- */
  metti(sfondo);
  var h0 = location.hash.replace('#', '');
  if (F[h0]) vai(h0, { istante: true, nofocus: true }); else setHash(null);
  if (h0 === 'supporto') { setHash(null); apriSupporto(); }
  window.requestAnimationFrame(rendiDock);
}
</script>
