# TEMPORANEO: serve a capire perché prove/tutte.sh è rosso su macOS e Windows. Si toglie prima della fine.
name: diagnosi-tutte

on:
  push:
    branches: ["notte-2026-11-14/prove-ci"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosi:
    name: diagnosi · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: tutte con la traccia
        shell: bash
        continue-on-error: true
        run: |
          echo "bash: $(command -v bash) $BASH_VERSION"
          bash -c 'exec 9>"$RUNNER_TEMP/traccia.txt"; BASH_XTRACEFD=9; set -x; . prove/tutte.sh' 2>&1 | tail -5 || true
          echo "--- traccia (ultime righe)"
          tail -60 "$RUNNER_TEMP/traccia.txt"
