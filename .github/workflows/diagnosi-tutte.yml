# TEMPORANEO: serve a capire perché prove/tutte.sh è rosso su macOS e Windows. Si toglie prima della fine.
name: diagnosi-tutte

on:
  push:
    branches: ["notte-2026-11-14/prove-ci"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosi:
    name: diagnosi · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: tutte con la traccia
        shell: bash
        continue-on-error: true
        run: |
          echo "bash: $(command -v bash) $BASH_VERSION"
          TMPDIR=$RUNNER_TEMP/tt; mkdir -p "$TMPDIR"; export TMPDIR
          bash -x prove/tutte.sh 2>&1 | tail -3 || true
          echo "--- uscita-1 (l'uscita della prova che muore)"
          cat "$TMPDIR"/tmp.*/uscita-1.txt | tail -30
          echo "--- con bash di Homebrew"
          ls /opt/homebrew/bin/bash && /opt/homebrew/bin/bash --version | head -1 && /opt/homebrew/bin/bash prove/tutte.sh 2>&1 | tail -16 || true
