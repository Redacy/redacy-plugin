# TEMPORANEO: serve a capire perché prove/tutte.sh è rosso su macOS e Windows. Si toglie prima della fine.
name: diagnosi-tutte

on:
  push:
    branches: ["notte-2026-11-14/prove-ci"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosi:
    name: diagnosi · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: tutte con la traccia
        shell: bash
        continue-on-error: true
        run: |
          echo "bash: $(command -v bash) $BASH_VERSION"
          BASH_XTRACEFD=9 bash -x prove/tutte.sh 9>"$RUNNER_TEMP/traccia.txt" 2>&1 | tail -3 || true
          echo "--- traccia (ultime righe)"
          grep -n "copie_con_versione" "$RUNNER_TEMP/traccia.txt" | head -3; awk '/^\+ copie_con_versione/{f=1} f' "$RUNNER_TEMP/traccia.txt" | head -40
