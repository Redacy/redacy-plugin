# TEMPORANEO: serve a capire i due rossi di prove/tutte.sh su macOS. Si toglie prima della fine.
name: diagnosi-tutte

on:
  push:
    branches: ["notte-2026-11-14/prove-ci"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosi:
    name: diagnosi · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: i due rossi, per intero
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "=== prova-corsa"
          bash prove/grafi/prova-corsa.sh 2>&1 | grep -vE "^ok " | head -40
          echo "=== prova-riordina"
          bash prove/ordina/prova-riordina.sh 2>&1 | grep -vE "^ok " | head -60
          echo "=== uname e tools"
          uname -a; command -v timeout gtimeout; stat --version 2>&1 | head -1
