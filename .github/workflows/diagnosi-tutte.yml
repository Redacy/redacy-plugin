# TEMPORANEO: serve a capire perché prove/tutte.sh è rosso su macOS. Si toglie prima della fine.
name: diagnosi-tutte

on:
  push:
    branches: ["notte-2026-11-14/prove-ci"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosi:
    name: diagnosi · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: la funzione che muore, a mano
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo "bash: $BASH_VERSION"
          sed -n '/^copie_con_versione()/,/^}/p' prove/tutte.sh > "$RUNNER_TEMP/f.sh"
          bash -x -c 'set -u; RADICE="$PWD"; BASE="$RUNNER_TEMP/b"; mkdir -p "$BASE"; . "$RUNNER_TEMP/f.sh"; copie_con_versione; echo "rc=$?"' 2>&1 | tail -40
          echo "--- stessa cosa con bash di Homebrew su tutta la suite"
          ls /opt/homebrew/bin/bash && /opt/homebrew/bin/bash prove/tutte.sh 2>&1 | tail -16
